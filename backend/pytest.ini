[pytest]
testpaths = tests
pythonpath = .

# Coverage is measured on every run, including a partial one: `pytest -k x`
# measured nothing before this, because the flags lived in `Dockerfile.test`'s
# CMD and a command given to `docker run` replaces it.
#
# `--cov-branch` counts something line coverage does not — a line that ran is
# not a branch that was taken — so it lowers the reported total on identical
# tests. Compare like with like when reading an older figure.
#
# The floor is deliberately NOT here. `--cov-fail-under` in `addopts` fails
# every partial run: `pytest tests/test_files.py` would exit 1 on passing
# tests, including the single-file reproductions a reviewer is asked to run. A
# floor is a claim about a COMPLETE run, so it lives where completeness is
# known — the CI step, as `PYTEST_ADDOPTS`.
#
# `--cov-precision=2` widens the comparison from whole percents to two
# decimals. coverage.py prints its pass/fail message from the raw total and
# computes its exit code from the ROUNDED one, so the two disagree wherever a
# total rounds up: a floor at a rounded value can print `FAIL` and still exit
# 0. Truncate the measured total, and bracket the exit code rather than
# reading the message.
#
# This makes `pytest-cov` a hard requirement of anything that loads this file:
# without it pytest fails to start rather than running unmeasured. It comes
# from `requirements-dev.txt`, which `Dockerfile.test` installs.
#
# `pytest --no-cov -k something` turns measurement off for a tight loop. It is
# a speed switch and nothing depends on it: with the floor out of `addopts`, a
# partial run is green whether or not you pass it.
addopts = --cov=app --cov-branch --cov-precision=2 --cov-report=term-missing
