<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mobile inspector sheet — layout fixture</title>
    <!--
      The compiled globals.css, built by ../build-fixture-css.ts. No
      <style> of its own, for the reason the other fixtures have none:
      every declaration measured here has to have come out of the app's
      own stylesheet, or the measurement is a test of this page.
    -->
    <link rel="stylesheet" href="./globals.built.css" />
  </head>
  <body>
    <!--
      The class lists the sheet and the inspector render, written out.

      Both forms of the inspector are here, because the spec measures the
      column form *and* the two-tier form it replaced: a case that only
      draws the shipped arrangement cannot show that the arrangement is
      what makes the difference. `mobileInspectorSheetFixtureParity.test.tsx`
      renders both from the real components and fails if either drifts.

      `visibleHeight` is the whole of C-2. vaul slides the drawer down by
      `--snap-point-height` and the drawer is anchored to the bottom
      edge, so that many pixels of it are always past the fold; this box
      is the drawer less exactly that, taken from vaul's own published
      number rather than from a snap value repeated here.

      The last keys are the page *behind* the sheet, for unit D: the
      shell root that publishes `data-sheet-snap`, the page row, the
      canvas that scrolls, the media host the canvas holds and the player
      wrapper the stylesheet sticks to the top of it. Without them there
      is nothing for the derived snap to be measured against.
      `MediaShell.test.tsx` renders the real shell and compares these five
      class lists and the padding; the case at the bottom of
      `mobileInspectorSheetFixtureParity.test.tsx` is what says every key
      is compared somewhere.

      The host is not decoration between the canvas and the player. It
      carries `p-4`, and a top padding is travel in front of a sticky box
      — the stylesheet takes that one side off under `[data-sheet-snap]`,
      and a fixture without the host could not tell whether it had.
    -->
    <script type="application/json" id="fixture-markup">
      {
        "drawer": "fixed bottom-0 left-0 right-0 z-[46] flex flex-col rounded-t-2xl border-t border-bg-border bg-bg-card outline-none",
        "visible": "flex min-h-0 shrink-0 flex-col",
        "visibleHeight": "calc(100% - var(--snap-point-height, 0px))",
        "handle": "mx-auto mt-3 h-1 w-12 shrink-0 rounded-full bg-bg-border",
        "scroller": "min-h-0 flex-1 overflow-auto",
        "scrollerPaddingBottom": "calc(env(safe-area-inset-bottom, 0px) + 16px)",
        "columnRoot": "flex flex-col",
        "columnHeader": "px-4 pt-4 pb-3",
        "columnStrip": "flex gap-1 overflow-x-auto border-b border-bg-border px-2 pointer-coarse:min-h-11 sticky top-0 z-10 bg-bg-card",
        "columnPanel": "space-y-4 p-4",
        "panelRoot": "flex h-full min-h-0 flex-col",
        "panelHeader": "shrink-0 px-4 pt-4 pb-3",
        "panelStrip": "flex gap-1 overflow-x-auto border-b border-bg-border px-2 pointer-coarse:min-h-11 shrink-0",
        "panelPanel": "min-h-0 flex-1 space-y-4 overflow-auto p-4",
        "tab": "whitespace-nowrap border-b-2 px-3 py-2 text-xs font-medium transition-colors pointer-coarse:min-h-11 border-transparent text-text-muted hover:text-text-primary",
        "drawerVh": 0.9,
        "pageRoot": "flex h-full w-full flex-col",
        "chrome": "flex h-12 shrink-0 items-center gap-2 border-b border-bg-border bg-bg-card px-3",
        "canvas": "flex min-w-0 min-h-0 flex-1 flex-col overflow-auto",
        "mediaHost": "media-detail-host w-full space-y-4 p-4",
        "player": "media-detail-player",
        "framedShimPaddingTop": "56.25%",
        "peekPx": 56
      }
    </script>

    <!-- The page the sheet covers. Empty for every case that is only
         about the drawer, so nothing below it moves. -->
    <div id="page"></div>
    <div id="frame"></div>

    <script>
      const SPEC = JSON.parse(
        document.getElementById("fixture-markup").textContent,
      );

      /**
       * vaul's own arithmetic, reproduced.
       *
       * `snapPointsOffset` maps each fractional snap point to
       * `window.innerHeight - snap * window.innerHeight` and the active
       * one is published on the drawer as `--snap-point-height`. It is
       * the same expression in vaul 1.1.2's `useSnapPoints`, and
       * `MobileInspectorSheet.test.tsx` reads the variable back off a
       * real vaul render at each snap so that this copy cannot drift
       * from it silently.
       */
      const snapPointHeight = (snap) => window.innerHeight * (1 - snap);

      /**
       * The sheet at one snap, in one of the two inspector forms, with a
       * chosen bound on the scroller.
       *
       * `bound` is what makes the mutants expressible:
       *
       * - `visible-box` is what ships — a box of `100% -
       *   var(--snap-point-height)` between the drawer and the scroller.
       * - `cap-50vh` is what it replaced: no box, and a `max-height` of
       *   the snap written into the scroller by hand. It lands a drag
       *   handle's height too low and is a second definition of a number
       *   vaul already publishes.
       * - `none` is the scroller filling the drawer, which is what the
       *   drawer's own overhang then does to it.
       */
      window.buildSheet = ({
        snap,
        mode,
        bound,
        headerPx,
        bodyPx,
        drawerPx,
      }) => {
        const frame = document.getElementById("frame");
        frame.replaceChildren();

        const offset = snapPointHeight(snap);
        const drawer = document.createElement("div");
        drawer.className = SPEC.drawer;
        drawer.dataset.testid = "mobile-inspector-sheet";
        // The component's own height, in px, off the viewport vaul
        // solves its snaps in — `sheetDrawerHeightPx(innerHeight)`.
        // `drawerPx` overrides it for the case that draws the drawer at
        // a *different* viewport's `90vh`, which is what a CSS viewport
        // unit does on a phone showing its URL bar.
        drawer.style.height = `${drawerPx ?? SPEC.drawerVh * window.innerHeight}px`;
        drawer.style.setProperty("--snap-point-height", `${offset}px`);
        // vaul writes this inline on the same element; the CSS form it
        // also ships (`data-vaul-delayed-snap-points`) reads the same
        // variable. Either way the drawer is translated down by it, and
        // that is the whole reason its foot is off the screen.
        drawer.style.transform = `translate3d(0, ${offset}px, 0)`;

        const scroller = document.createElement("div");
        scroller.className = SPEC.scroller;
        scroller.dataset.testid = "mobile-inspector-content";
        scroller.style.paddingBottom = SPEC.scrollerPaddingBottom;

        const handle = document.createElement("div");
        handle.className = SPEC.handle;
        handle.dataset.testid = "mobile-inspector-handle";

        if (bound === "visible-box") {
          const visible = document.createElement("div");
          visible.className = SPEC.visible;
          visible.dataset.testid = "mobile-inspector-visible";
          visible.style.height = SPEC.visibleHeight;
          visible.append(handle, scroller);
          drawer.append(visible);
        } else {
          if (bound === "cap-50vh") {
            scroller.style.maxHeight = snap === 0.9 ? "90vh" : "50vh";
          }
          drawer.append(handle, scroller);
        }

        const column = mode === "column";
        const root = document.createElement("div");
        root.className = column ? SPEC.columnRoot : SPEC.panelRoot;
        root.dataset.testid = "inspector-shell";

        const header = document.createElement("div");
        header.className = column ? SPEC.columnHeader : SPEC.panelHeader;
        header.dataset.testid = "inspector-header";
        // A box of a stated height rather than the real header's own
        // content: the header's height is a property of the file, and
        // the cases below vary it deliberately against the height of the
        // sheet they are drawn in.
        header.style.height = `${headerPx}px`;

        const strip = document.createElement("div");
        strip.className = column ? SPEC.columnStrip : SPEC.panelStrip;
        strip.dataset.testid = "inspector-tabs";
        strip.setAttribute("role", "tablist");
        for (const label of ["Info", "Transcript"]) {
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("role", "tab");
          button.className = SPEC.tab;
          button.textContent = label;
          strip.append(button);
        }

        const panel = document.createElement("div");
        panel.className = column ? SPEC.columnPanel : SPEC.panelPanel;
        panel.dataset.testid = "inspector-panel";

        const body = document.createElement("div");
        body.style.height = `${bodyPx}px`;
        // Positioned, standing in for the tab content that is: an addon
        // section with a `relative` wrapper, a popover anchor, a chip
        // row. Two positioned boxes at `z-index: auto` paint in document
        // order, and the panel comes after the strip — so without a
        // stacking order of its own the strip is the one underneath,
        // and the tab body travels visibly over it.
        body.style.position = "relative";
        body.style.background = "var(--color-bg-card, #fff)";
        const end = document.createElement("div");
        end.dataset.testid = "inspector-end";
        // The last line of the tab, and the thing the reader is trying to
        // reach. Given a height of its own so "its bottom is on screen"
        // is a claim about a box rather than about a zero-height marker
        // that any rounding would satisfy.
        end.style.height = "24px";
        end.textContent = "the end of the tab";
        panel.append(body, end);

        root.append(header, strip, panel);
        scroller.append(root);
        frame.append(drawer);
      };

      /**
       * The page behind the sheet: chrome, a canvas that scrolls, and a
       * player stuck to the top of it.
       *
       * Unit D derives `half` from this player's bottom edge, so the
       * fixture has to draw a player before there is anything to derive
       * from — and it has to draw it inside the box the app sticks it in,
       * because `position: sticky` travels only within its own containing
       * block and the whole claim is that the player does not move while
       * the reader scrolls.
       *
       * `data-sheet-snap` on the shell root is the mobile test the
       * stylesheet makes; without it the player is in flow and scrolls
       * away, and the case would be measuring a different page.
       *
       * The shell's height is the fixture's own — the app's root layout
       * gives it — and so is `bodyPx`. The player's height is not: a
       * framed player gets the ratio shim and the stylesheet's own width
       * cap, so how tall it is at a given viewport is measured here
       * rather than declared.
       */
      window.buildPage = ({ playerPx, framed, bodyPx }) => {
        const host = document.getElementById("page");
        host.replaceChildren();
        host.style.height = "100vh";

        const shell = document.createElement("div");
        shell.className = SPEC.pageRoot;
        shell.dataset.testid = "file-detail-shell";
        shell.dataset.sheetSnap = "expanded";

        const chrome = document.createElement("div");
        chrome.className = SPEC.chrome;
        chrome.dataset.testid = "file-detail-chrome";

        const canvas = document.createElement("main");
        canvas.className = SPEC.canvas;
        canvas.dataset.testid = "file-detail-canvas";
        // The page ends above the resting strip; the shell writes this
        // inline for the same reason the fixture does.
        canvas.style.paddingBottom = `${SPEC.peekPx}px`;

        // The box `MediaCanvas` draws around the player and everything
        // under it. It carries the padding the stylesheet takes off one
        // side of, and it is where `--rail-avail` is published.
        const mediaHost = document.createElement("div");
        mediaHost.className = SPEC.mediaHost;
        mediaHost.dataset.testid = "media-detail-host";

        const player = document.createElement("div");
        player.className = SPEC.player;
        player.dataset.testid = "media-detail-player";
        const frame = document.createElement("div");
        frame.style.background = "#000";
        if (framed) {
          // A framed player's height is a function of its width — the
          // `.loft` embed's `padding-top: 56.25%` shim, which is the same
          // 16:9 `aspect-video` gives native video — so the stylesheet's
          // width cap is what decides it. Nothing here states a height.
          player.dataset.framed = "true";
          frame.style.paddingTop = SPEC.framedShimPaddingTop;
        } else {
          // A control bar and nothing above it: no ratio to invert, so
          // the height is the fixture's own input.
          frame.style.height = `${playerPx}px`;
        }
        player.append(frame);

        const below = document.createElement("div");
        below.style.height = `${bodyPx}px`;
        below.textContent = "the description, the comments, the summaries";

        mediaHost.append(player, below);
        canvas.append(mediaHost);
        shell.append(chrome, canvas);
        host.append(shell);

        // `--rail-avail` is the scroll container's visible height,
        // measured — `useCompanionMetrics` reads `pane.clientHeight` and
        // `mediaHostStyle` publishes it here. It is what caps a framed
        // player's width, and therefore what makes a phone held sideways
        // draw a player as tall as its own scrollport. Set after the
        // append, because there is nothing to measure before it.
        mediaHost.style.setProperty("--rail-avail", `${canvas.clientHeight}px`);
      };

      /** Scrolls the canvas, which is what the sticky player travels in. */
      window.scrollCanvas = (to) => {
        const canvas = document.querySelector(
          "[data-testid='file-detail-canvas']",
        );
        if (canvas) canvas.scrollTop = to;
      };

      /**
       * Where everything landed, and which box the browser will actually
       * scroll.
       *
       * `verticallyScrollable` is the C-1 question asked directly: not
       * "is there a scroller" but "which element has more content than
       * box in the block axis". The two-tier form answers
       * `inspector-panel` and the column form answers
       * `mobile-inspector-content`, and that difference is the defect.
       * The tab strip is a scroll container too — `overflow-x: auto`
       * computes `overflow-y` to `auto` — so a count of scroll containers
       * would not separate them, and a count of anything would not say
       * which one it found.
       */
      window.measureSheet = (scrollTo) => {
        const drawer = document.querySelector(
          "[data-testid='mobile-inspector-sheet']",
        );
        const scroller = drawer.querySelector(
          "[data-testid='mobile-inspector-content']",
        );
        const visible = drawer.querySelector(
          "[data-testid='mobile-inspector-visible']",
        );
        const strip = drawer.querySelector("[data-testid='inspector-tabs']");
        const header = drawer.querySelector("[data-testid='inspector-header']");
        const end = drawer.querySelector("[data-testid='inspector-end']");
        const player = document.querySelector(
          "[data-testid='media-detail-player']",
        );
        const canvas = document.querySelector(
          "[data-testid='file-detail-canvas']",
        );

        if (scrollTo !== undefined) scroller.scrollTop = scrollTo;

        const rect = (el) => {
          const box = el.getBoundingClientRect();
          return { top: box.top, bottom: box.bottom, height: box.height };
        };

        const scrollerBox = scroller.getBoundingClientRect();
        const verticallyScrollable = [...drawer.querySelectorAll("*")]
          .filter((el) => {
            const overflowY = getComputedStyle(el).overflowY;
            if (overflowY !== "auto" && overflowY !== "scroll") return false;
            return el.scrollHeight > el.clientHeight + 1;
          })
          .map((el) => el.dataset.testid ?? el.tagName.toLowerCase());

        return {
          viewportHeight: window.innerHeight,
          snapPointHeight: Number.parseFloat(
            getComputedStyle(drawer).getPropertyValue("--snap-point-height"),
          ),
          drawer: rect(drawer),
          // `100%` inside the drawer resolves against its content box,
          // which `border-t` puts a pixel below its border box. That
          // pixel is above the visible box rather than inside it, so the
          // box still ends exactly at the fold — but the arithmetic only
          // balances with the border named.
          drawerBorderTop: Number.parseFloat(
            getComputedStyle(drawer).borderTopWidth,
          ),
          visible: visible ? rect(visible) : null,
          scroller: rect(scroller),
          strip: rect(strip),
          header: rect(header),
          end: rect(end),
          // Null for every case that draws no page, which is every case
          // that is only about the drawer.
          player: player ? rect(player) : null,
          playerPosition: player ? getComputedStyle(player).position : null,
          // The scrollport the player travels in, which is also what
          // `--rail-avail` is measured from and therefore what caps a
          // framed player's width. Null for the cases that draw no page.
          canvasClientHeight: canvas ? canvas.clientHeight : null,
          // Relative to the box that scrolls: "the strip is at the top of
          // its scrollport" is the sticky property, and an absolute
          // viewport coordinate would also be satisfied by a page that
          // never scrolled.
          stripTopInScroller: strip.getBoundingClientRect().top - scrollerBox.top,
          headerTopInScroller:
            header.getBoundingClientRect().top - scrollerBox.top,
          stripPosition: getComputedStyle(strip).position,
          // The premise of the stacking case, stated so it cannot be
          // satisfied by a fixture that quietly stopped positioning the
          // tab body — at which point the strip would win by default and
          // the case would pass for the wrong reason.
          bodyPosition: getComputedStyle(
            drawer.querySelector("[data-testid='inspector-panel'] > div"),
          ).position,
          // What is actually drawn at the middle of the strip. "Sticky"
          // is only half the property: a strip pinned to the right place
          // and painted under the tab body is not on screen either, and
          // no rectangle says so.
          stripHit: (() => {
            const box = strip.getBoundingClientRect();
            const el = document.elementFromPoint(
              box.left + box.width / 2,
              box.top + box.height / 2,
            );
            if (!el) return null;
            const owner = el.closest("[data-testid]");
            return owner ? owner.dataset.testid : el.tagName.toLowerCase();
          })(),
          stripBackground: getComputedStyle(strip).backgroundColor,
          scrollTop: scroller.scrollTop,
          maxScroll: scroller.scrollHeight - scroller.clientHeight,
          verticallyScrollable,
        };
      };
    </script>
  </body>
</html>
