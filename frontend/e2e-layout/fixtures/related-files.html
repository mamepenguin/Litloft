    <!--
      The tile `RelatedFilesSection` renders, written out as the element,
      the exact class list and the descendant tree.

      The class lists are not decoration here — they are the geometry.
      The tile's name column is what is left after `p-2` (16px), the
      `w-24` thumbnail (96px), the `gap-3` between them (12px) and the
      14px kind icon with its `gap-1.5`; drop any one of them from this
      table and the fixture measures a name column the app never has, so
      the character counts it reports stop being about this repository.
      `relatedFilesFixtureParity.test.tsx` renders the real component and
      fails if this table and the component come apart in either
      direction.

      Four shapes. The thumbnail box holds either an `<img>` or the kind
      glyph and they are different subtrees; the glyph beside the name is
      the file's kind, so `video` is its own row rather than `thumbnail`
      with a different picture. `missing` is the third class list the
      anchor can carry (`opacity-60`), and it adds a badge to the second
      row — which takes width away from the folder path but not from the
      name.

      `video` is not here for its geometry, which is `thumbnail`'s. It is
      here because the parity test's media guard has to have a video
      relation to render: this repository mounts `<video>` behind
      `file_type === "video"` and a hover delay, so a guard whose states
      are all images and documents walks past the branch it exists to
      catch. Measured — with three shapes, adding `VideoPreview` to the
      tile under that condition survived every suite.

      The lucide `<path>` children are a deliberate stop: their `d` is the
      icon's business and moves no box.
    -->

          "attrs": { "href": "*" },
          "children": [
            {

              "class": "relative flex h-16 w-24 shrink-0 items-center justify-center overflow-hidden rounded-lg bg-bg-elevated",
              "children": [
                {

                  "class": "h-full w-full object-cover",
                  "attrs": { "alt": "", "loading": "lazy", "src": "*" }
                }
              ]
            },
            {
              "tag": "div",
              "class": "flex min-w-0 flex-1 flex-col justify-between py-0.5",
              "children": [
                {
                  "tag": "div",
                  "class": "flex items-center gap-1.5 text-sm font-medium text-text-primary",
                  "children": [
                    {

                      "class": "lucide lucide-film text-text-muted",
                      "attrs": { "width": "14", "height": "14" }
                    },
                    { "tag": "span", "class": "truncate", "children": [] }

                {

          "attrs": { "href": "*" },

                    {
                      "tag": "span",
                      "class": "rounded-lg bg-bg-elevated px-1.5 py-0.5 text-[10px] font-medium uppercase text-text-muted",

    <!-- The width the section is laid out at. `.related-files-host`
         establishes the container the column count switches on, so this
         is the only free variable on the page. -->
    <div id="frame"></div>

    <script>
      // A 1x1 transparent GIF. The thumbnail box is `h-16 w-24` and the
      // picture is `object-fit: cover` inside it, so the image's own size
      // moves nothing — and a data URI needs no network, which is what
      // lets this page run off file://.
      const PIXEL =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

      const SHAPES = JSON.parse(
        document.getElementById("fixture-markup").textContent,
      );

      const NS = "http://www.w3.org/2000/svg";

      const build = (spec, text) => {
        const el =
          spec.tag === "svg" || spec.tag === "path"
            ? document.createElementNS(NS, spec.tag)
            : document.createElement(spec.tag);
        el.setAttribute("class", spec.class);
        if (spec.tag === "img") el.src = PIXEL;
        if (spec.tag === "a") el.href = "#";
        for (const [name, value] of Object.entries(spec.attrs ?? {})) {
          if (value !== "*") el.setAttribute(name, value);
        }
        for (const child of spec.children ?? []) el.append(build(child, text));
        return el;
      };

      /**
       * One tile of the named shape, built from the table above and
       * nothing else, with the two truncating spans filled in.
       *
       * The name is the string the spec measures characters of, so it is
       * passed in rather than baked here: a fixture that chose its own
       * filename would report a character count about a name the library
       * does not hold.
       */
      const buildTile = (shape, name, folder) => {
        const spec = SHAPES[shape];
        if (!spec) throw new Error(`no such tile shape: ${shape}`);
        const tile = build(spec);
        const spans = tile.querySelectorAll("span.truncate");
        spans[0].textContent = name;
        if (spans[1]) spans[1].textContent = folder;
        if (shape === "missing" && spans[2]) spans[2].textContent = "missing";
        tile.dataset.shape = shape;
        return tile;
      };

      /**
       * The section at a chosen width, in a viewport that could contain
       * it.
       *
       * The viewport is sized to the frame for the reason the justified
       * fixture gives: a rule keyed to `@media` rather than to the
       * container is invisible to a suite that lays a 352px grid out in a
       * 1280px window — and `sm:grid-cols-2`, the declaration this
       * component was fixed for, is exactly that rule.
       */
      window.buildRelated = ({ width, count, shapes, forceColumns, name, folder }) => {
        const frame = document.getElementById("frame");
        frame.style.width = `${width}px`;
        frame.replaceChildren();

        const host = document.createElement("div");
        host.className = "related-files-host";
        const grid = document.createElement("div");
        grid.className = "related-files-grid grid gap-2";
        // `forceColumns` overrides the stylesheet's answer, and is used
        // for exactly one thing: laying out the column count a rejected
        // threshold would have produced, so the reason it was rejected
        // is a measurement in the suite rather than a paragraph in a
        // comment. Nothing else may pass it.
        if (forceColumns) {
          grid.style.gridTemplateColumns = `repeat(${forceColumns}, minmax(0, 1fr))`;
        }

        for (let i = 0; i < count; i++) {
          grid.append(buildTile(shapes?.[i] ?? "thumbnail", name, folder));
        }

        host.append(grid);
        frame.append(host);
      };

      /**
       * Every tile's realized box, the grid's own, and how much of the
       * filename each name column can actually show.
       *
       * The character count is measured with the span's own resolved font
       * through a canvas, not guessed from a width: what the reader gets
       * is a number of glyphs, and that is the thing the threshold
       * was chosen against.
       */
      window.measureRelated = () => {
        const grid = document.querySelector(".related-files-grid");
        const tiles = [...grid.children];
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        // The fractional box, not `clientWidth`. An integer width rounds
        // the column down by up to a pixel, and at the one width where
        // that matters — a name column wider than the whole name — it
        // drops the last character and reports 26 of 27 for a filename
        // that is entirely on screen. The half-pixel is sub-pixel
        // tolerance, an order below a glyph, so it cannot buy a
        // character anywhere the answer is close.
        const visibleChars = (span) => {
          const cs = getComputedStyle(span);
          ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
          const room = span.getBoundingClientRect().width + 0.5;
          const text = span.textContent;
          let n = 0;
          while (n < text.length && ctx.measureText(text.slice(0, n + 1)).width <= room) {
            n += 1;
          }
          return n;
        };

        const tops = new Set(tiles.map((t) => Math.round(t.getBoundingClientRect().top)));

        return {
          gridWidth: grid.getBoundingClientRect().width,
          rows: tops.size,
          columns: Math.round(tiles.length / tops.size),
          tiles: tiles.map((tile) => {
            const name = tile.querySelector("span.truncate");
            return {
              shape: tile.dataset.shape,
              width: tile.getBoundingClientRect().width,
              nameWidth: name.getBoundingClientRect().width,
              nameChars: visibleChars(name),
              nameLength: name.textContent.length,
            };
          }),
        };
      };
    </script>
  </body>
</html>
