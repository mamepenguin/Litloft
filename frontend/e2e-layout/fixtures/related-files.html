    <div id="frame"></div>

    <script>
      // A 1x1 transparent GIF: a data URI needs no network, which lets
      // this page run off file://.
      const PIXEL =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

      const SHAPES = JSON.parse(
        document.getElementById("fixture-markup").textContent,
      );

      const NS = "http://www.w3.org/2000/svg";

      const build = (spec, text) => {
        const el =
          spec.tag === "svg" || spec.tag === "path"
            ? document.createElementNS(NS, spec.tag)
            : document.createElement(spec.tag);
        el.setAttribute("class", spec.class);
        if (spec.tag === "img") el.src = PIXEL;
        if (spec.tag === "a") el.href = "#";
        for (const [name, value] of Object.entries(spec.attrs ?? {})) {
          if (value !== "*") el.setAttribute(name, value);
        }
        for (const child of spec.children ?? []) el.append(build(child, text));
        return el;
      };

      const buildTile = (shape, name, folder) => {
        const spec = SHAPES[shape];
        if (!spec) throw new Error(`no such tile shape: ${shape}`);
        const tile = build(spec);
        tile.querySelector("[data-related-title]").textContent = name;
        tile.querySelector("span.truncate").textContent = folder;
        const duration = tile.querySelector("[data-related-duration]");
        if (duration) duration.textContent = "32:15";
        if (shape === "missing") {
          tile.querySelector("span.truncate").nextElementSibling.textContent = "missing";
        }
        tile.dataset.shape = shape;
        return tile;
      };

      window.buildRelated = ({ width, count, shapes, forceColumns, name, folder }) => {
        const frame = document.getElementById("frame");
        frame.style.width = `${width}px`;
        frame.replaceChildren();

        const host = document.createElement("div");
        host.className = "related-files-host";
        const grid = document.createElement("div");
        grid.className = "related-files-grid grid gap-x-2 gap-y-0.5";
        // `forceColumns` overrides the stylesheet's answer; it exists only
        // to lay out what a rejected threshold would have produced.
        if (forceColumns) {
          grid.style.gridTemplateColumns = `repeat(${forceColumns}, minmax(0, 1fr))`;
        }

        for (let i = 0; i < count; i++) {
          grid.append(buildTile(shapes?.[i] ?? "thumbnail", name, folder));
        }

        host.append(grid);
        frame.append(host);
      };

      const box = (el) => {
        const r = el.getBoundingClientRect();
        return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, width: r.width, height: r.height };
      };

      window.measureRelated = () => {
        const grid = document.querySelector(".related-files-grid");
        const tiles = [...grid.children];
        const tops = new Set(tiles.map((t) => Math.round(t.getBoundingClientRect().top)));

        return {
          gridWidth: grid.getBoundingClientRect().width,
          rows: tops.size,
          columns: Math.round(tiles.length / tops.size),
          tiles: tiles.map((tile) => {
            const title = tile.querySelector("[data-related-title]");
            const lineHeight = parseFloat(getComputedStyle(title).lineHeight);
            const thumb = tile.querySelector(".relative");
            const duration = tile.querySelector("[data-related-duration]");
            return {
              shape: tile.dataset.shape,
              tile: box(tile),
              title: box(title),
              titleLines: Math.round(title.getBoundingClientRect().height / lineHeight),
              titleClipped: title.scrollHeight > title.clientHeight + 1,
              thumb: thumb ? box(thumb) : null,
              duration: duration ? box(duration) : null,
            };
          }),
        };
      };
    </script>
