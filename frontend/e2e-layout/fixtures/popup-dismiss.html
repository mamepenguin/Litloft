<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>popup dismissal — layout fixture</title>
    <!--
      The compiled globals.css, built by ../build-fixture-css.ts. Every
      tier on this page comes from that stylesheet, so an arrangement that
      says "the bar is above the scrim" is one the app's own rules produce.
    -->
    <link rel="stylesheet" href="./globals.built.css" />
  </head>
  <body>
    <!--
      Four ways to dismiss a popup, crossed with four things that can be
      stacked over the scrim.

      `shipped` is `DismissScrim`: a `document` press outside the popup
      closes it, and the `click` that press produces is swallowed once, in
      the capture phase. `scrim-click` is what this unit shipped for three
      rounds — the scrim takes the click, which is only true while the
      scrim is what the tap reaches. `scrim-press` is what `ContextMenu`
      did, and `document-press` is what seven menus did: both answer the
      press and leave the click to the page.

      The arrangement is the second half of the URL (`#strategy:arrangement`)
      and it is the point of the file. `plain` is a scrim over one `z-0`
      button — the page this fixture used to be, on which *every* scrim
      tier passes. The other three are real arrangements from the app: the
      inspector's `sticky top-0 z-10` tab strip written after the scrim,
      the selection bar's `fixed bottom-0 z-50`, and that same bar with the
      scrim nested inside a `sticky top-0 z-20` box of its own — the folder
      toolbar, where the scrim's number is compared only against its
      siblings and so cannot be raised to answer the bar at all.

      `scrimClass` is compared against `MENU_SCRIM` by
      `popupDismissFixtureParity.test.tsx`, and `dismissOn` / `swallows` /
      `scrimPointerEvents` against what the component actually does when it
      is driven. Without that this page is a test of itself.
    -->
    <script type="application/json" id="fixture-markup">
      {
        "scrimClass": "fixed inset-0 z-30 bg-black/30 sm:bg-transparent",
        "scrimPointerEvents": "none",
        "dismissOn": "pointerdown",
        "swallows": "click",
        "menu": "fixed left-2 top-2 z-40 w-40 rounded-2xl border border-bg-border bg-bg-card p-3 shadow-lg",
        "underneath": "fixed inset-0 z-0 bg-bg-elevated text-text-primary",
        "stickyBar": "sticky top-0 z-10 block w-full bg-bg-card p-2.5 text-text-primary",
        "fixedBar": "fixed bottom-0 left-0 right-0 z-50 bg-bg-card p-2.5 text-text-primary",
        "nest": "sticky top-0 z-20 bg-bg-card"
      }
    </script>

    <script>
      const SPEC = JSON.parse(
        document.getElementById("fixture-markup").textContent,
      );

      const [strategy, arrangement = "plain"] = (
        location.hash.slice(1) || "shipped"
      ).split(":");

      // The whole viewport, so that wherever the spec taps in the `plain`
      // arrangement is over it. A real page has a control somewhere under
      // the scrim; which one is not the point.
      const underneath = document.createElement("button");
      underneath.type = "button";
      underneath.id = "underneath";
      underneath.className = SPEC.underneath;
      underneath.dataset.clicks = "0";
      underneath.dataset.contextmenus = "0";
      underneath.textContent = "underneath";
      document.body.append(underneath);

      const state = document.createElement("div");
      state.id = "state";
      state.dataset.dismissed = "0";
      state.hidden = true;
      document.body.append(state);

      // Where the scrim and the menu are written. `nested` puts them
      // inside a box that is its own stacking context, which is the
      // arrangement in which a scrim's `z` decides nothing at all.
      let host = document.body;
      if (arrangement === "nested") {
        const nest = document.createElement("div");
        nest.id = "nest";
        nest.className = SPEC.nest;
        document.body.append(nest);
        host = nest;
      }

      const menu = document.createElement("div");
      menu.id = "menu";
      menu.className = SPEC.menu;
      menu.textContent = "menu";

      let teardown = () => {};
      function dismiss() {
        state.dataset.dismissed = String(Number(state.dataset.dismissed) + 1);
        menu.remove();
        scrim?.remove();
        teardown();
      }

      let scrim = null;
      if (strategy !== "document-press") {
        scrim = document.createElement("div");
        scrim.id = "scrim";
        scrim.className = SPEC.scrimClass;
        host.append(scrim);
      }
      host.append(menu);

      // The chrome, written *after* the scrim, which is what the app does:
      // the tab strip comes later in the inspector's column, and the
      // selection bar is mounted by the page around the toolbar.
      let target = underneath;
      if (arrangement !== "plain") {
        const bar = document.createElement("button");
        bar.type = "button";
        bar.id = "bar";
        bar.className =
          arrangement === "sticky-bar" ? SPEC.stickyBar : SPEC.fixedBar;
        bar.dataset.clicks = "0";
        bar.textContent = "bar";
        document.body.append(bar);
        target = bar;
      }

      for (const el of new Set([underneath, target])) {
        el.addEventListener("click", () => {
          el.dataset.clicks = String(Number(el.dataset.clicks) + 1);
        });
      }
      // A row that opens a context menu answers this and re-raises the
      // menu on itself. Counting it is how "the gesture reached the row"
      // is observed without building a second menu.
      underneath.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        underneath.dataset.contextmenus =
          String(Number(underneath.dataset.contextmenus) + 1);
      });

      if (strategy === "shipped") {
        // `DismissScrim`. The press decides, and the click that press
        // produces is taken once in the capture phase — so nothing here
        // depends on which element the tap reached.
        scrim.style.pointerEvents = SPEC.scrimPointerEvents;
        const onPress = (e) => {
          if (menu.contains(e.target)) return;
          swallowNextClick(e);
          dismiss();
        };
        document.addEventListener(SPEC.dismissOn, onPress, true);
        teardown = () => document.removeEventListener(SPEC.dismissOn, onPress, true);

        function swallowNextClick(press) {
          const swallow = (e) => {
            e.preventDefault();
            e.stopPropagation();
            off();
          };
          const abandon = (e) => {
            if (e === press) return;
            off();
          };
          const off = () => {
            document.removeEventListener(SPEC.swallows, swallow, true);
            document.removeEventListener("pointerdown", abandon, true);
            document.removeEventListener("pointercancel", abandon, true);
          };
          document.addEventListener(SPEC.swallows, swallow, true);
          document.addEventListener("pointerdown", abandon, true);
          document.addEventListener("pointercancel", abandon, true);
        }
      } else if (strategy === "scrim-click") {
        // Three rounds of this unit. Correct exactly while the scrim is
        // the element the tap lands on.
        scrim.addEventListener("click", dismiss);
      } else if (strategy === "scrim-press") {
        scrim.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          dismiss();
        });
      } else {
        // No scrim: nothing between the finger and the page.
        const onPress = () => dismiss();
        document.addEventListener("mousedown", onPress);
        document.addEventListener("touchstart", onPress);
        teardown = () => {
          document.removeEventListener("mousedown", onPress);
          document.removeEventListener("touchstart", onPress);
        };
      }

      document.body.dataset.strategy = strategy;
      document.body.dataset.arrangement = arrangement;
      document.body.dataset.ready = "1";
    </script>
  </body>
</html>
