<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>justified grid — layout fixture</title>
    <!--
      The compiled globals.css, built by ../build-fixture-css.ts.

      This page carries no <style> block of its own on purpose. Every
      declaration a cell obeys has to have come out of the app's own
      stylesheet, or the measurement is a test of the fixture.
    -->
    <link rel="stylesheet" href="./globals.built.css" />
  </head>
  <body>
    <!--
      Every cell shape the app puts inside `.justified-grid`, written out
      as the element type and the exact class list the component renders.

      Half of what the CSS says is about which element carries which
      class, so a fixture that wrote a shape of its own would hold the
      stylesheet only for markup nothing ships. Two callers write these
      cells — `JustifiedFileCell` and `ArchiveEntryCard` — and the second
      draws a `<button>` carrying `overflow-hidden`, which is why
      `button.justified-grid-cell` and `.justified-grid-cell.overflow-hidden`
      are real selectors and not hypotheticals.

      **This table is not the components' own; it is a second copy.**
      `justifiedGridFixtureParity.test.tsx` renders both components over
      every reachable combination of their props and fails if the class
      vocabulary here and the class vocabulary there come apart, in either
      direction. Editing one side alone is a red suite.

      `chain` is the descendant chain the builder nests inside the cell,
      outermost first. The parity test locates each entry in the rendered
      component by its own classes and then requires the match to be
      exact, so a class added on either side is caught.
    -->
    <script type="application/json" id="fixture-markup">
      {
        "photo": {
          "source": "JustifiedFileCell",
          "tag": "div",
          "class": "justified-grid-cell relative",
          "chain": [
            {
              "tag": "a",
              "class": "group relative block h-full w-full overflow-hidden rounded-xl bg-bg-elevated"
            },
            { "tag": "img", "class": "h-full w-full object-cover" }
          ]
        },
        "photoDraggable": {
          "source": "JustifiedFileCell",
          "tag": "div",
          "class": "justified-grid-cell relative select-none",
          "chain": [
            {
              "tag": "a",
              "class": "group relative block h-full w-full overflow-hidden rounded-xl bg-bg-elevated"
            },
            { "tag": "img", "class": "h-full w-full object-cover" }
          ]
        },
        "photoDragging": {
          "source": "JustifiedFileCell",
          "tag": "div",
          "class": "justified-grid-cell relative opacity-40 select-none",
          "chain": [
            {
              "tag": "a",
              "class": "group relative block h-full w-full overflow-hidden rounded-xl bg-bg-elevated"
            },
            { "tag": "img", "class": "h-full w-full object-cover" }
          ]
        },
        "photoCut": {
          "source": "JustifiedFileCell",
          "tag": "div",
          "class": "justified-grid-cell relative opacity-50",
          "chain": [
            {
              "tag": "a",
              "class": "group relative block h-full w-full overflow-hidden rounded-xl bg-bg-elevated"
            },
            { "tag": "img", "class": "h-full w-full object-cover" }
          ]
        },
        "archiveOpenable": {
          "source": "ArchiveEntryCard",
          "tag": "button",
          "class": "justified-grid-cell relative overflow-hidden rounded-xl bg-bg-card cursor-pointer transition-colors hover:bg-bg-elevated",
          "chain": [
            { "tag": "div", "class": "relative h-full w-full" },
            {
              "tag": "div",
              "class": "flex h-full w-full items-center justify-center"
            },
            { "tag": "img", "class": "h-full w-full object-cover" }
          ]
        },
        "archiveDeadEnd": {
          "source": "ArchiveEntryCard",
          "tag": "div",
          "class": "justified-grid-cell relative overflow-hidden rounded-xl bg-bg-card",
          "chain": [
            { "tag": "div", "class": "relative h-full w-full" },
            {
              "tag": "div",
              "class": "flex h-full w-full items-center justify-center"
            },
            { "tag": "img", "class": "h-full w-full object-cover" }
          ]
        }
      }
    </script>

    <!-- The width the grid is laid out at. The spec sets it per case;
         `.justified-grid-host` establishes the container the row height
         switches on, so this is the only free variable in the page. -->
    <div id="frame"></div>

    <script>
      // A 1x1 transparent GIF. The cell's shape comes from `--jg-ratio`
      // and `object-fit: cover`, never from the picture's own size, so
      // the smallest decodable image is the honest one to use — and it
      // needs no network, which is what lets this page run off file://.
      const PIXEL =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

      const SHAPES = JSON.parse(
        document.getElementById("fixture-markup").textContent,
      );

      window.fixtureMarkup = () => SHAPES;

      const build = (spec) => {
        const el = document.createElement(spec.tag);
        el.className = spec.class;
        if (spec.tag === "img") {
          el.src = PIXEL;
          el.alt = "";
        }
        if (spec.tag === "a") el.href = "#";
        if (spec.tag === "button") el.type = "button";
        return el;
      };

      /**
       * One cell of the named shape, built from the table above and
       * nothing else — so a shape that drifts from the table cannot be
       * drawn, and the table is the only thing the parity test has to
       * keep honest.
       */
      const buildCell = (shape, ratio, index, flip) => {
        const spec = SHAPES[shape];
        if (!spec) throw new Error(`no such cell shape: ${shape}`);
        const cell = build(spec);
        cell.style.setProperty("--jg-ratio", String(ratio));
        cell.dataset.flipKey = `p${index}`;
        cell.dataset.shape = shape;
        if (flip) cell.dataset.flip = flip;

        let parent = cell;
        for (const link of spec.chain) {
          const child = build(link);
          parent.append(child);
          parent = child;
        }
        return cell;
      };

      /**
       * The grid, at a chosen width and in a viewport that could contain
       * it.
       *
       * The viewport matters: a rule keyed to `@media (max-width: …)`
       * rather than to the container is invisible to a suite that leaves
       * the window at its default 1280px while laying out a 420px grid,
       * and 420px is a phone. Sizing the window to the grid means the
       * narrow cases are measured in a window a phone could have.
       */
      window.buildGrid = ({ ratios, width, flip, shapes }) => {
        const frame = document.getElementById("frame");
        frame.style.width = `${width}px`;
        frame.replaceChildren();

        const host = document.createElement("div");
        host.className = "justified-grid-host";
        const grid = document.createElement("div");
        grid.className = "justified-grid";

        ratios.forEach((ratio, i) => {
          grid.append(buildCell(shapes?.[i] ?? "photo", ratio, i, flip));
        });

        const tail = document.createElement("div");
        tail.className = "justified-grid-tail";
        tail.setAttribute("aria-hidden", "true");
        grid.append(tail);

        host.append(grid);
        frame.append(host);
      };

      /**
       * Every cell's realized box, plus the ratio it was asked for and
       * the markup it was built as.
       *
       * `getBoundingClientRect` rather than `offsetWidth`: the layout
       * engine resolves flex to a fraction of a pixel and the integer
       * accessors would hand the spec a rounding error to explain away.
       */
      window.measureCells = () =>
        Array.from(document.querySelectorAll(".justified-grid-cell")).map(
          (cell) => {
            const rect = cell.getBoundingClientRect();
            return {
              ratio: Number(
                getComputedStyle(cell).getPropertyValue("--jg-ratio"),
              ),
              shape: cell.dataset.shape,
              tag: cell.tagName.toLowerCase(),
              className: cell.className,
              chain: Array.from(cell.querySelectorAll("*")).map((el) => ({
                tag: el.tagName.toLowerCase(),
                className: el.className,
              })),
              width: rect.width,
              height: rect.height,
              top: rect.top,
              left: rect.left,
            };
          },
        );

      /** The grid's own content box — what a line has to add up to. */
      window.measureGrid = () => {
        const grid = document.querySelector(".justified-grid");
        const style = getComputedStyle(grid);
        return {
          width: grid.getBoundingClientRect().width,
          gap: parseFloat(style.columnGap),
        };
      };

      /** The resolved transition on the first cell, in its `data-flip` state. */
      window.measureFlip = () => {
        const style = getComputedStyle(
          document.querySelector(".justified-grid-cell"),
        );
        return {
          transitionProperty: style.transitionProperty,
          transitionDuration: style.transitionDuration,
          transitionTimingFunction: style.transitionTimingFunction,
          transformOrigin: style.transformOrigin,
        };
      };
    </script>
  </body>
</html>
