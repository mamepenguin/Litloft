<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Without this, a context that sets `isMobile` lays the page out at
      Chromium's mobile default instead of the viewport the spec asked
      for, and every width-conditional rule answers for a page nobody
      is measuring. `spec-viewport.spec.ts` opens this file under
      exactly that context and reads the width back.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>addon policy table — layout fixture</title>
    <!--
      The compiled globals.css, built by ../build-fixture-css.ts. No
      <style> of its own, for the reason the other fixtures have none:
      every declaration measured here has to have come out of the app's
      own stylesheet, or the measurement is a test of this page.
    -->
    <link rel="stylesheet" href="./globals.built.css" />
  </head>
  <body>
    <!--
      The two class lists the sticky heading depends on, written out.

      They are the whole mechanism: `sticky top-0` on the `th` resolves
      against the nearest scrollport, and the wrapper is that scrollport
      only because it is bounded. Take `max-h-[70vh]` off and the head
      sticks to a box that never scrolls, which looks exactly like no
      rule at all — measured on the running app, 290px above the
      viewport. `addonPolicyFixtureParity.test.tsx` renders the real
      section and fails if either list drifts from what is written here.
    -->
    <script type="application/json" id="fixture-markup">
      {
        "wrapper": "max-h-[70vh] overflow-x-auto overflow-y-auto",
        "headCell": "sticky top-0 z-10 whitespace-nowrap bg-bg-card px-4 py-2 text-center text-sm font-medium text-text-primary",
        "rowHeadCell": "sticky top-0 z-10 whitespace-nowrap bg-bg-card py-2 pr-6 text-left text-xs font-semibold tracking-wide text-text-muted",
        "table": "min-w-full border-collapse text-sm",
        "driveRow": "border-t border-bg-border",
        "driveNameCell": "whitespace-nowrap py-3 pr-6 text-xs font-semibold tracking-wide text-text-muted",
        "driveToggleCell": "px-4 py-3 text-center",
        "driveToggle": "h-4 w-4 cursor-pointer accent-accent",
        "featureNameCell": "whitespace-nowrap py-2 pr-6 pl-4",
        "featureToggleCell": "px-4 py-2 text-center",
        "featureSwitch": "relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-focus-ring focus:ring-offset-2 bg-accent-teal"
      }
    </script>

    <div id="frame"></div>

    <script>
      const SPEC = JSON.parse(
        document.getElementById("fixture-markup").textContent,
      );

      /**
       * The table at a chosen size, in the app's own row shape.
       *
       * Not `rows` identical rows: the section emits a drive row and then
       * one sub-row per feature the drive has enabled, and the two are
       * different heights (`py-3` against `py-2`, a 16px checkbox against
       * a 24px switch). Four drives with two features each is twelve rows
       * and 548px, which is the number every claim about this table is
       * arithmetic on — twelve uniform rows measure 588px and would make
       * all of them wrong by 40px.
       */
      window.buildPolicyTable = ({ width, drives, featuresPerDrive, columns }) => {
        const frame = document.getElementById("frame");
        frame.style.width = `${width}px`;
        frame.replaceChildren();

        const section = document.createElement("section");
        section.className = "rounded-xl border border-bg-border bg-bg-card p-6";

        const wrapper = document.createElement("div");
        wrapper.className = SPEC.wrapper;
        wrapper.tabIndex = 0;

        const table = document.createElement("table");
        table.className = SPEC.table;

        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        const corner = document.createElement("th");
        corner.className = SPEC.rowHeadCell;
        headRow.append(corner);
        for (let c = 0; c < columns; c++) {
          const th = document.createElement("th");
          th.className = SPEC.headCell;
          th.textContent = `Addon ${c + 1}`;
          headRow.append(th);
        }
        thead.append(headRow);
        table.append(thead);

        const tbody = document.createElement("tbody");
        for (let d = 0; d < drives; d++) {
          const tr = document.createElement("tr");
          tr.className = SPEC.driveRow;
          const td = document.createElement("td");
          td.className = SPEC.driveNameCell;
          td.textContent = `Drive ${d + 1}`;
          tr.append(td);
          for (let c = 0; c < columns; c++) {
            const cell = document.createElement("td");
            cell.className = SPEC.driveToggleCell;
            const box = document.createElement("input");
            box.type = "checkbox";
            box.className = SPEC.driveToggle;
            cell.append(box);
            tr.append(cell);
          }
          tbody.append(tr);

          for (let f = 0; f < featuresPerDrive; f++) {
            const sub = document.createElement("tr");
            const name = document.createElement("td");
            name.className = SPEC.featureNameCell;
            const row = document.createElement("div");
            row.className = "flex items-center gap-2";
            const arrow = document.createElement("span");
            arrow.className = "text-text-muted";
            arrow.textContent = "\u21b3";
            const label = document.createElement("span");
            label.className = "text-sm text-text-primary";
            label.textContent = `Feature ${f + 1}`;
            row.append(arrow, label);
            name.append(row);
            sub.append(name);
            for (let c = 0; c < columns; c++) {
              const cell = document.createElement("td");
              // Only the addon's own column carries the switch; the rest
              // are the empty cells the section renders.
              if (c === 0) {
                cell.className = SPEC.featureToggleCell;
                const sw = document.createElement("button");
                sw.type = "button";
                sw.setAttribute("role", "switch");
                sw.className = SPEC.featureSwitch;
                const knob = document.createElement("span");
                knob.className =
                  "inline-block h-4 w-4 rounded-full bg-white shadow transition-transform translate-x-6";
                sw.append(knob);
                cell.append(sw);
              }
              sub.append(cell);
            }
            tbody.append(sub);
          }
        }
        table.append(tbody);
        wrapper.append(table);
        section.append(wrapper);
        frame.append(section);
      };

      /**
       * Where the heading is, relative to the box it is supposed to stick
       * to, after the wrapper has been scrolled.
       *
       * Relative and not absolute: "the heading is at the top of its
       * scrollport" is the property, and an absolute viewport coordinate
       * would also be satisfied by a page that had not scrolled at all.
       */
      window.measurePolicyTable = (scrollTop) => {
        const wrapper = document.querySelector("#frame div[tabindex]");
        const table = wrapper.querySelector("table");
        const th = table.querySelector("thead th:last-child");
        const firstRow = table.querySelector("tbody tr");
        wrapper.scrollTop = scrollTop ?? 0;
        const box = wrapper.getBoundingClientRect();
        return {
          // The width the frame was actually built at, read off the box
          // rather than taken from the caller. Without it a case that
          // asserts only booleans is satisfied by any width that shares
          // its answers.
          frameWidth: document.querySelector("#frame").getBoundingClientRect().width,
          // The cap, and the box it actually resolved to. They are not
          // the same number and conflating them is what made the earlier
          // cases wrong: `max-height` is a ceiling, so a table shorter
          // than it leaves the box at the table's own height.
          capPx: Number.parseFloat(getComputedStyle(wrapper).maxHeight),
          wrapperHeight: wrapper.clientHeight,
          tableHeight: table.getBoundingClientRect().height,
          scrollsVertically: wrapper.scrollHeight > wrapper.clientHeight + 1,
          scrollsHorizontally: wrapper.scrollWidth > wrapper.clientWidth + 1,
          scrolledTo: wrapper.scrollTop,
          headTop: th.getBoundingClientRect().top - box.top,
          firstRowTop: firstRow.getBoundingClientRect().top - box.top,
          headPosition: getComputedStyle(th).position,
          headBackground: getComputedStyle(th).backgroundColor,
        };
      };
    </script>
  </body>
</html>
