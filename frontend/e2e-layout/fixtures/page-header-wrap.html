<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>page header wrap — layout fixture</title>
    <link rel="stylesheet" href="./globals.built.css" />
  </head>
  <body>
    <header id="header" class="flex flex-col gap-1 px-4 py-2">
      <div class="flex min-w-0 flex-col gap-2 sm:flex-row sm:items-start sm:gap-3">
        <div class="min-w-0 sm:flex-1">
          <h1 class="sr-only text-2xl font-bold text-text-primary">Shelf</h1>
          <input class="w-full" value="Shelf" />
        </div>
        <div class="flex min-w-0 flex-wrap items-center gap-2 sm:contents">
          <div class="text-sm text-text-muted">12 books</div>
          <div class="flex max-w-full flex-shrink-0 flex-wrap items-center gap-2 sm:max-w-none">
            <button class="action whitespace-nowrap border px-3 py-1 text-sm">並び順 追加日（新しい順）</button>
            <button class="action whitespace-nowrap border px-3 py-1 text-sm">対象 すべての本と文書</button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
