# process-kit schema_version: 1
#
# How a change is classified LOW, MEDIUM, HIGH or CRITICAL. The score is
#    base (from the number of changed lines) + points of the highest zone + number of
#    distinct modifiers that match,
# then promotions raise the level. Zone points: LOW 0, MEDIUM 4, HIGH 8, CRITICAL 10.
# This file is protected: a change to it is classified CRITICAL.
#
# Row types:
#
#    zone <glob> <LEVEL>          a path matching the glob belongs to a zone of that level.
#                                The first matching zone row wins for a path, so a narrow
#                                row must come before a broader one.
#    default_zone <LEVEL>         level of a path no zone row matches. Default: MEDIUM.
#                                LOW is not allowed.
#    modifier <regex> <name>      a changed line (added or removed) matching the extended
#                                regex adds one to the score, once per name.
#    promote <names> <LEVEL>      when every modifier named (comma list) matched, the level
#                                is at least this.
#    human <glob>                 a path matching the glob is in a human zone: an area where
#                                failure is not allowed or where reviewers miss errors.
#                                A change there needs a human to read the diff.
#    base <limit> <points>        points for up to <limit> changed lines; limits ascend and
#                                the last row has limit *.
#    level <limit> <LEVEL>        level for a score up to <limit>; limits ascend and the
#                                last row has limit *.
#
# Globs are gitignore-style: * does not cross /, ** does. A glob without a / matches the
# final path component at any depth.
# Paths under docs/process/reviews/ and .process/runs/ add nothing to the score and take
# no zone.

# Build, deployment, gates and secrets.
zone .github/** CRITICAL
zone .githooks/** CRITICAL
zone process/** CRITICAL
zone scripts/process-gates/** CRITICAL
zone **/Dockerfile* CRITICAL
zone docker-compose*.yml CRITICAL
zone configure.py HIGH

# Access control and the drive boundary, the addon trust boundary, and code that writes
# data the filesystem cannot regenerate (watch history, tags, comments) or migrates it.
zone backend/app/auth.py HIGH
zone backend/app/routers/auth.py HIGH
zone backend/app/services/safepath.py HIGH
zone backend/app/routers/internal.py HIGH
zone backend/app/routers/addon_proxy.py HIGH
zone backend/app/services/scanner.py HIGH
zone backend/app/services/fileops.py HIGH
zone backend/app/database.py HIGH

zone backend/tests/** LOW
zone docs/** LOW
default_zone MEDIUM

# No human rows: Litloft has no human code review (docs/process/PROJECT.md, Human zones).

modifier (shutil\.rmtree|os\.remove|\.unlink\(|DELETE FROM|session\.delete\(|\.delete\(synchronize_session) persistence
modifier (asyncio\.(create_task|gather|Lock|Semaphore)|threading\.|run_in_executor|call_soon_threadsafe) concurrency
modifier (CREATE TABLE|ALTER TABLE|DROP TABLE|DROP COLUMN|CREATE (UNIQUE )?INDEX|Column\(|UniqueConstraint\() schema

promote persistence HIGH
promote schema HIGH
promote concurrency,schema CRITICAL

base 50 0
base 200 1
base 500 2
base * 3

level 2 LOW
level 5 MEDIUM
level 9 HIGH
level * CRITICAL
