# process-kit schema_version: 1
#
# Reviewers run by review.sh, one row each:
#
#    id | engine | role | min_risk | perspectives
#
#    id            a name, letters digits . _ - ; it names the reviewer's output file.
#    engine        claude: a fresh `claude -p` process.
#    role          read: judges the diff with read-only tools.
#                 verify: records a verdict on each finding of the other reviewers; it is
#                 always run and has no min_risk.
#                 mutate: breaks the implementation one change at a time in a throwaway
#                 worktree prepared by the worktree_setup row of gates.conf, where the
#                 kit version supports it.
#    min_risk      a read reviewer runs when the classified risk is at least this level
#                 (LOW, MEDIUM, HIGH, CRITICAL). Empty means LOW.
#    perspectives  comma list of viewpoints this reviewer is told to take, for example
#                 security,auth. Empty means none beyond the role.
#
# The default install has one read and one verify reviewer, both claude. To add a reviewer,
# add a row with a new id; a read reviewer with a higher min_risk only joins riskier changes.
claude-read | claude | read | LOW |
claude-verify | claude | verify | |

# Example. Remove the leading `#   ` to add a reviewer that joins HIGH and CRITICAL changes.
#
#   claude-security | claude | read | HIGH | security,auth
