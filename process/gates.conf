# process-kit schema_version: 1
#
# Gates run by precheck, in file order, before every review and before a push.
# One row per gate:
#
#    name | command | required | expect_regex | profiles
#
#    name          a label shown in the report.
#    command       run from the repository root. It may contain " | ".
#    required      yes: a failure, or a command that does not exist, fails precheck.
#                 no: a command that does not exist prints SKIP; a failure still fails.
#    expect_regex  extended regex the command's output must match. Empty means no check.
#                 For a test gate, use a pattern that only matches when tests ran, so
#                 that "zero tests ran" fails instead of passing.
#    profiles      comma list of local and ci. Empty means both.
#
# A row named worktree_setup is not a gate. It prepares a throwaway worktree (dependencies,
# generated files, caches) before a mutate reviewer runs there.
#
# No gate is active by default: a project fills this in. The rows below are examples that
# depend on the stack; replace the commands, then remove the leading `#   `.
#
#   tests | your-test-runner --all | yes | [1-9][0-9]* (tests|passed) | local,ci
#   lint | your-linter . | no | | local
#   worktree_setup | your-dependency-installer | no | |

# frontend: vitest, tsc and eslint in frontend/, run only when the change touches frontend/
# or addons/*/frontend/ (scripts/process-gates/frontend.sh). expect_regex passes either the
# script's own skip line or a vitest summary with at least one passed test, so a run that
# collected nothing fails. Local only: process.yml installs no pnpm, and ci.yml runs the
# same checks on every pull request. The backend tests run in Docker and stay in ci.yml.
frontend | bash scripts/process-gates/frontend.sh | yes | ^frontend-gate: skipped|Tests +[1-9][0-9]* passed | local
