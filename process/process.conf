# process-kit schema_version: 1
#
# Project settings read by the process scripts. One `key=value` per line, no spaces
# around `=`. A key left out takes the default stated here. This file is protected:
# a change to it is classified CRITICAL.

# Directories (space separated, relative to the repository root) searched for SPEC-IDs
# cited by tests. Default: tests
test_dirs=tests

# Extended regex an ID in docs/specs/INDEX.md must match in full. Default: SPEC-[A-Z]+-[0-9]{3}
spec_ref_pattern=SPEC-[A-Z]+-[0-9]{3}

# States a ledger row may be in (space separated). Default: draft approved implemented superseded
ledger_states=draft approved implemented superseded

# Domain names used in SPEC-IDs (space separated). Each must match the letters part of
# spec_ref_pattern. Default: CORE
domains=CORE

# Branches whose push also runs the traceability check (space separated). Default: main develop
protected_branches=main develop

# The ref a change is compared against. Default: origin/main
base_ref=origin/main

# Cap, in bytes, on each fix-commit diff attached to a later review round. Default: 200000
max_diff_bytes=200000

# The agent that implements an approved spec. Empty means the session's default agent.
implementation_agent=
