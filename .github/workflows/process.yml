name: process

on: pull_request

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - run: scripts/process/precheck.sh --profile ci
      - run: scripts/process/classify-risk.sh --base "$BASE"
      - run: scripts/process/check-traceability.sh
      - id: report
        run: |
          scripts/process/ci-report.sh --base "$BASE" > "$RUNNER_TEMP/report.json"
          echo "label=$(jq -r .label "$RUNNER_TEMP/report.json")" >> "$GITHUB_OUTPUT"
      - if: steps.report.outputs.label == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/report.json', 'utf8'));
            const issue_number = context.issue.number;
            await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['human-review-required'] });
            if (report.comment) {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body: report.comment });
            }
