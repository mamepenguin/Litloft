services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./drives.json:/app/drives.json:ro
      - ./videos:/app/drives/default:ro
      - ./data:/app/data
    environment:
      - DRIVES_CONFIG=/app/drives.json
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
