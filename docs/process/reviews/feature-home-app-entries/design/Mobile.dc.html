<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム モバイル</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#211922;text-decoration:none}a:hover{color:#d63031}
</style>
</helmet>
<div style="width: 390px; height: 1460px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; color: #211922; overflow: hidden">

  <div style="height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center">
    <button aria-label="メニュー" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center; color: #62625b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>

  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #f6f6f3; display: flex; align-items: center; justify-content: center; color: #62625b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
      <div style="display: flex; flex-direction: column">
        <h1 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700">ホーム</h1>
        <div style="font-size: 13px; color: #62625b">Home Media</div>
      </div>
      <button style="margin-left: auto; min-height: 44px; padding: 8px 16px; border: 0; border-radius: 16px; background: #e5e5e0; color: #211922; font-size: 14px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>追加</button>
    </header>

    <nav aria-label="アプリ" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; min-height: 72px; box-sizing: border-box; border-radius: 12px; background: #f6f6f3; font-size: 12px; line-height: 1.3; text-align: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>ライブラリ</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; min-height: 72px; box-sizing: border-box; border-radius: 12px; background: #f6f6f3; font-size: 12px; line-height: 1.3; text-align: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/></svg>動画</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; min-height: 72px; box-sizing: border-box; border-radius: 12px; background: #f6f6f3; font-size: 12px; line-height: 1.3; text-align: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>読む</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; min-height: 72px; box-sizing: border-box; border-radius: 12px; background: #f6f6f3; font-size: 12px; line-height: 1.3; text-align: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>質問</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; min-height: 72px; box-sizing: border-box; border-radius: 12px; background: #f6f6f3; font-size: 12px; line-height: 1.3; text-align: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4M2 10h4M2 14h4M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>ノート</a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; min-height: 72px; box-sizing: border-box; border-radius: 12px; background: #f6f6f3; font-size: 12px; line-height: 1.3; text-align: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></svg>フォトダイアリー</a>
      <a href="#" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; min-height: 72px; box-sizing: border-box; border-radius: 12px; background: #f6f6f3; font-size: 12px; line-height: 1.3; text-align: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>受信箱<span style="position: absolute; top: 6px; right: 8px; min-width: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #e0e0d9; font-size: 12px; line-height: 20px; text-align: center; color: #211922">3</span></a>
    </nav>

    <sc-for list="{{shelves}}" as="shelf" hint-placeholder-count="5">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">{{shelf.title}}</h2>
          <a href="#" style="margin-left: auto; padding: 12px 0; font-size: 13px; color: #62625b">すべて表示</a>
        </div>
        <div style="display: flex; gap: 12px; margin-right: -16px; overflow: hidden">
          <sc-for list="{{shelf.cards}}" as="c" hint-placeholder-count="4">
            <div style="flex: 0 0 152px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
              <div style="aspect-ratio: 16 / 9; border-radius: 12px; background: {{c.bg}}; position: relative; overflow: hidden">
                <sc-if value="{{c.hasProgress}}" hint-placeholder-val="{{ false }}">
                  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(112,112,112,0.85)"><div style="height: 4px; width: {{c.pct}}; background: #d63031"></div></div>
                </sc-if>
              </div>
              <div style="font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{c.name}}</div>
              <div style="font-size: 12px; color: #62625b">{{c.meta}}</div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1460}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = ['#c9b8a8', '#a9b7c2', '#d9c7b0', '#b5c4a8', '#c7a9a9'];
    const mk = (items) => items.map((it, i) => ({ bg: tones[i % tones.length], hasProgress: !!it[2], pct: it[2] || '0%', name: it[0], meta: it[1] }));
    return {
      shelves: [
        { title: '続きから', cards: mk([
          ['京都旅行 2026-10 vlog.mp4', '動画 · 残り 12 分', '62%'],
          ['データ指向アプリケーション設計.epub', '本 · 41%', '41%'],
          ['確定申告の手引き 2026.pdf', 'PDF · 18 / 64 ページ', '28%']
        ]) },
        { title: '最近見た', cards: mk([
          ['週次ふりかえり 2026-11-09.md', 'ノート · 昨日'],
          ['IMG_4821.HEIC', '写真 · 昨日'],
          ['カレーのレシピ.pdf', 'PDF · 2 日前']
        ]) },
        { title: 'お気に入り', cards: mk([
          ['カレーのレシピ.pdf', 'PDF'],
          ['NAS の復旧手順.md', 'ノート'],
          ['ヨガ 20 分.mp4', '動画']
        ]) },
        { title: 'ピックアップ', cards: mk([
          ['2025 年 夏の北海道.mp4', '動画 · 1 年前の今ごろ'],
          ['機械学習の数学.pdf', 'PDF · 似た本'],
          ['庭の記録 2024-05.md', 'ノート']
        ]) },
        { title: '最近追加', cards: mk([
          ['WWDC 2026 Keynote.mp4', '動画 · 今日'],
          ['IMG_4830.HEIC', '写真 · 今日'],
          ['ねこの写真集.epub', '本 · 昨日']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
