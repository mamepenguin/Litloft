<x-dc>
<helmet>
<style>
body{margin:0}

<div style="width: 375px; height: 520px; box-sizing: border-box; background: #ffffff; color: #211922; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 8px;">

      <button type="button" style="display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; border: 1px dashed #91918c; background: transparent; padding: 4px 10px; font-size: 12px; color: #62625b; font-family: inherit;">＋ 条件</button>

      <button type="button" aria-label="「京都の旅行」に上書き保存" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border: 0; border-radius: 16px; background: #e5e5e0; padding: 6px 12px; font-size: 14px; color: #211922; font-family: inherit;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"></path><path d="M7 3v4a1 1 0 0 0 1 1h7"></path></svg>上書き保存</button>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid rgba(145,145,140,0.2);">
    <div style="display: flex; border-radius: 12px; background: #f6f6f3; padding: 2px; font-size: 14px; width: 148px; flex: none;">
      <span style="flex: 1; text-align: center; border-radius: 10px; background: #ffffff; padding: 4px 0;">ファイル</span>
      <span style="flex: 1; text-align: center; padding: 4px 0; color: #62625b;">箇所</span>
    </div>
    <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; min-height: 44px;"><input type="checkbox" style="width: 16px; height: 16px;">シーン</label>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 12px; color: #62625b; white-space: nowrap;">18 件</span>
    <button type="button" aria-label="その他" style="width: 44px; height: 44px; border: 1px solid rgba(145,145,140,0.2); background: #ffffff; border-radius: 16px; font-size: 14px; color: #62625b; font-family: inherit;">⋯</button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;"><div style="aspect-ratio: 16 / 9; border-radius: 12px; background: #e0e0d9;"></div><span style="font-size: 13px;">嵐山 竹林.mp4</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px;"><div style="aspect-ratio: 16 / 9; border-radius: 12px; background: #e0e0d9;"></div><span style="font-size: 13px;">伏見稲荷 夜.mp4</span></div>
  </div>
</div>
