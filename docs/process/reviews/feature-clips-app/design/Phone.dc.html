<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クリップ ホーム（スマートフォン）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#211922;text-decoration:none}a:hover{color:#d63031}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #ffffff; font-family: -apple-system, system-ui, 'ヒラギノ角ゴ Pro W3', Meiryo, sans-serif; color: #211922; display: flex; flex-direction: column">
  <div style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid rgba(145,145,140,0.2)">
    <button type="button" aria-label="メニュー" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #211922">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
    </button>
    <span style="font-size: 15px; font-weight: 700">Litloft</span>
  </div>
  <div style="padding: 24px 16px 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #f6f6f3; display: flex; align-items: center; justify-content: center; color: #62625b">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6Z"></path></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.35">クリップ</h1>
        <div style="font-size: 13px; color: #62625b">main · 42 件</div>
      </div>
      <button type="button" aria-label="Web ページをクリップ" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #d63031; color: #ffffff; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      </button>
    </div>
    <div role="tablist" style="margin-top: 20px; display: flex; gap: 24px; border-bottom: 1px solid rgba(145,145,140,0.2); font-size: 14px">
      <a href="#" role="tab" aria-selected="true" style="padding: 0 0 10px; border-bottom: 2px solid #211922; font-weight: 600">ホーム</a>
      <a href="All.dc.html" role="tab" aria-selected="false" style="padding: 0 0 10px; color: #62625b">すべて</a>
    </div>
    <sc-for list="{{shelves}}" as="s" hint-placeholder-count="3">
      <section style="margin-top: 32px">
        <h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 700">{{s.title}}</h2>
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <a href="#" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 4px">
            <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 12px; background: #f6f6f3; flex-shrink: 0"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
              <span style="margin-top: 2px; font-size: 13px; line-height: 1.55; color: #62625b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.excerpt}}</span>
              <span style="margin-top: 4px; font-size: 12px; color: #62625b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.folder}} · {{r.when}}</span>
            </span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>

      ]},
      { title: '最近開いた', rows: [

        { title: 'View Transitions API 入門', excerpt: '同じ view-transition-name が二つあると…', when: '昨日', folder: 'tech/frontend' }
      ]},
      { title: '未確認', rows: [
        { title: 'SQLite の WAL モードを理解する', excerpt: 'WAL では書き込みが別ファイルに追記され…', when: '今日 9:12', folder: 'Inbox' },

}
</script>
</body>
</html>
