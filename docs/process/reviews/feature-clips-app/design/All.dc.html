<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クリップ すべて</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#211922;text-decoration:none}a:hover{color:#d63031}
</style>
</helmet>
<div style="width: 1280px; height: 900px; box-sizing: border-box; display: flex; background: #ffffff; font-family: -apple-system, system-ui, 'ヒラギノ角ゴ Pro W3', Meiryo, sans-serif; color: #211922">
  <div aria-hidden="true" style="width: 240px; flex-shrink: 0; border-right: 1px solid rgba(145,145,140,0.2); background: #ffffff"></div>
  <main style="flex: 1; min-width: 0; display: flex; justify-content: center; padding: 40px 48px 0">
    <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #f6f6f3; display: flex; align-items: center; justify-content: center; color: #62625b">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6Z"></path></svg>
        </span>
        <div style="flex: 1; min-width: 0">
          <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.35">クリップ</h1>
          <div style="font-size: 13px; color: #62625b">main · 42 件</div>
        </div>
        <button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: #d63031; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          Web ページをクリップ
        </button>
      </div>
      <div role="tablist" style="margin-top: 20px; display: flex; gap: 24px; border-bottom: 1px solid rgba(145,145,140,0.2); font-size: 14px">
        <a href="Main.dc.html" role="tab" aria-selected="false" style="padding: 0 0 10px; color: #62625b">ホーム</a>
        <a href="#" role="tab" aria-selected="true" style="padding: 0 0 10px; border-bottom: 2px solid #211922; font-weight: 600">すべて</a>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section style="margin-top: 28px">
          <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #62625b">{{g.label}}</h2>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="#" style="display: flex; align-items: flex-start; gap: 14px; padding: 12px; border-radius: 12px">
              <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 12px; background: #f6f6f3; flex-shrink: 0"></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 15px; font-weight: 600; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                <span style="margin-top: 2px; font-size: 13px; line-height: 1.55; color: #62625b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.excerpt}}</span>
              </span>
              <span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: #62625b; padding-top: 3px">
                <span>{{r.when}}</span>
                <span>{{r.folder}}</span>
              </span>
            </a>
          </sc-for>
        </section>
      </sc-for>
      <button type="button" style="margin: 24px auto 0; height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: #e5e5e0; color: #211922; font-size: 14px; font-weight: 600">さらに表示</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const groups = [
      { label: '今日', rows: [
        { title: 'SQLite の WAL モードを理解する', excerpt: 'WAL では書き込みが別ファイルに追記され、チェックポイントで本体に戻される…', when: '9:12', folder: 'Inbox' }
      ]},
      { label: '今週', rows: [
        { title: 'React 19 の use フックで変わること', excerpt: 'Promise をそのまま読めるようになり、Suspense との組み合わせが…', when: '昨日', folder: 'tech/frontend' },
        { title: '家庭用 NAS のバックアップ設計', excerpt: '3-2-1 ルールを家庭の規模に落とすと、外付けとクラウドの二系統が…', when: '11月9日', folder: 'Inbox' },
        { title: 'Docker の bind mount と named volume', excerpt: '単一ファイルを bind mount すると、存在しないパスはディレクトリとして…', when: '11月7日', folder: 'ops' }
      ]},
      { label: '先月', rows: [
        { title: 'Whisper の initial_prompt の効き方', excerpt: '固有名詞を先頭に並べると認識率が上がるが、長すぎると逆に…', when: '10月21日', folder: 'research/asr' },
        { title: 'View Transitions API 入門', excerpt: '同じ view-transition-name が二つあると遷移全体が落ちる…', when: '10月14日', folder: 'tech/frontend' }
      ]}
    ];
    return { groups };
  }
}
</script>
</body>
</html>
