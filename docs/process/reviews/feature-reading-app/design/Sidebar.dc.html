<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サイドバー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<nav aria-label="サイドバー" style="box-sizing:border-box;width:100%;min-height:1040px;padding:12px;display:flex;flex-direction:column;gap:2px;background:#ffffff;border-right:1px solid rgba(145,145,140,0.2);color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue','ヒラギノ角ゴ Pro W3',Meiryo,sans-serif;font-size:14px;line-height:1.6">

<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin:8px 0;border-radius:16px;font-weight:600"><span>家族ドライブ</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></div>

<sc-for list="{{top}}" as="r" hint-placeholder-count="6">
<a href="#row" style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;{{r.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"/></svg><span>{{r.label}}</span></a>
</sc-for>

<div style="height:1px;margin:10px 12px;background:rgba(145,145,140,0.2)"></div>

<sc-for list="{{views}}" as="r" hint-placeholder-count="5">
<a href="#row" style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"/></svg><span>{{r.label}}</span></a>
</sc-for>

<div style="padding:18px 12px 4px;font-size:11px;font-weight:600;color:#62625b">スマートフォルダ</div>
<sc-for list="{{smart}}" as="r" hint-placeholder-count="3">
<a href="#row" style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="2"/></svg><span>{{r.label}}</span></a>
</sc-for>

<div style="flex:1 1 auto"></div>
<a href="#trash" style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span>ゴミ箱</span></a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"reading","options":["reading","video"]},"$preview":{"width":240,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'reading';
    const on = 'background:#f6f6f3;font-weight:500;';
    const row = (id, label, d) => ({ label: label, d: d, style: a === id ? on : '' });
    return {
      top: [
        row('home', 'ホーム', 'm3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z'),
        row('library', 'ライブラリ', 'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'),
        row('ask', 'Ask', 'M7.9 20A9 9 0 1 0 4 16.1L2 22z'),
        row('notes', 'Notes', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5'),
        row('video', '動画', 'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM10 9.5l5 2.5-5 2.5z'),
        row('reading', '読む', 'M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z')
      ],
      views: [
        { label: 'お気に入り', d: 'm12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z' },
        { label: '高評価', d: 'M7 11v10H3V11zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2l-1.5 7A2 2 0 0 1 17.5 20H7' },
        { label: '最近見たもの', d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2' },
        { label: '最近追加', d: 'M12 5v14M5 12h14' },
        { label: 'すべてのファイル', d: 'M5 3h14v18H5z' }
      ],
      smart: [{ label: '技術書' }, { label: '未読の新着' }]
    };
  }
}
</script>
</body>
</html>
