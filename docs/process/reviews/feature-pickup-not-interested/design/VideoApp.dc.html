<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おすすめの興味なし</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 880px; height: 480px; box-sizing: border-box; padding: 40px; position: relative; display: flex; flex-direction: column; gap: 16px; background: {{bg}}; font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 18px; font-weight: 600; color: {{text}}">おすすめ</span>
<a href="#" style="font-size: 14px; color: {{muted}}; text-decoration: none">すべて見る</a>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<a href="#" style="display: block; text-decoration: none; min-width: 0">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: {{c.thumb}}">
<span style="position: absolute; right: 8px; bottom: 10px; padding: 2px 6px; border-radius: 8px; background: rgba(0,0,0,0.7); color: #ffffff; font-size: 12px; font-weight: 500">{{c.length}}</span>
</div>
<span style="display: block; margin-top: 12px; font-size: 16px; line-height: 22px; font-weight: 500; color: {{text}}">{{c.title}}</span>
</a>
</sc-for>
<div role="menu" style="position: absolute; left: 200px; top: 70px; width: 176px; border-radius: 16px; border: 1px solid {{border}}; background: {{card}}; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1); overflow: hidden">
<button type="button" role="menuitem" style="display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px; border: 0; background: transparent; color: {{muted}}; font-size: 14px; text-align: left">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
新しいタブで開く
</button>
<button type="button" role="menuitem" style="display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px; border: 0; background: {{hl}}; color: {{muted}}; font-size: 14px; text-align: left">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m4.9 4.9 14.2 14.2"></path></svg>
興味なし
</button>
</div>
</div>
<div role="status" style="position: absolute; right: 24px; bottom: 24px; max-width: 384px; display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: 16px; border: 1px solid {{border}}; background: {{bg}}; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-top: 2px; flex: none; color: {{accent}}"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
<p style="margin: 0; flex: 1; font-size: 14px; color: {{text}}">おすすめから外しました</p>
<button type="button" style="flex: none; border: 0; background: transparent; color: {{accent}}; font-size: 14px; font-weight: 500; padding: 2px 6px; border-radius: 4px">元に戻す</button>
<button type="button" aria-label="閉じる" style="flex: none; border: 0; background: transparent; color: {{muted}}; padding: 2px; border-radius: 4px; display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":880,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    return {
      cards: [
        { title: 'ライブ配信アーカイブ 2', length: '1:12:08', thumb: 'linear-gradient(135deg, #5c3a52, #2a1b26)' },
        { title: '週末キャンプの記録 3', length: '17:51', thumb: 'linear-gradient(135deg, #5c6b3a, #23301b)' },
        { title: '設計レビュー勉強会 第5回', length: '39:30', thumb: 'linear-gradient(135deg, #3a4a5c, #1b2430)' }
      ],
      hl: dark ? '#272725' : '#f6f6f3',
      bg: dark ? '#131312' : '#ffffff',
      card: dark ? '#1c1c1b' : '#ffffff',
      border: dark ? 'rgba(255,255,255,0.08)' : 'rgba(145,145,140,0.2)',
      text: dark ? '#eeeeea' : '#211922',
      muted: dark ? '#a5a59f' : '#62625b',
      accent: dark ? '#e85d5e' : '#d63031'
    };
  }
}
</script>
</body>
</html>
