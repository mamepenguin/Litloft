<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>チャンネルの動画一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#211922;text-decoration:none}a:hover{color:#211922;text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; background: #ffffff; font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; color: #211922; display: flex">
  <nav aria-label="サイドバー" style="width: 240px; flex-shrink: 0; border-right: 1px solid rgba(145,145,140,0.2); padding: 20px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 15px; font-weight: 600; padding: 4px 12px 16px">Litloft</div>
    <div style="font-size: 13px; color: #62625b; padding: 8px 12px; border-radius: 10px">ホーム</div>
    <div style="font-size: 13px; color: #62625b; padding: 8px 12px; border-radius: 10px">動画</div>
    <div style="font-size: 13px; color: #211922; font-weight: 500; padding: 8px 12px; border-radius: 10px; background: #f6f6f3">YouTube とフィード</div>
  </nav>
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="padding: 24px 32px 0; display: flex; flex-direction: column; gap: 6px">
      <a href="#" style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #62625b; align-self: flex-start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        YouTube とフィード
      </a>
      <div style="display: flex; align-items: baseline; gap: 12px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{channel}}</h1>
        <span style="font-size: 13px; color: #62625b">[ドライブ名]</span>
      </div>
    </header>
    <ul style="list-style: none; margin: 0; padding: 28px 32px 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 16px; row-gap: 32px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
        <li style="min-width: 0">
          <a href="#" style="display: block; text-decoration: none">
            <div style="position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: {{item.tone}}">
              <span style="position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,0.7); color: #ffffff; font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 8px; font-variant-numeric: tabular-nums">{{item.duration}}</span>
              <sc-if value="{{item.progress}}" hint-placeholder-val="{{ false }}">
                <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,0.5)"><div style="height: 4px; width: 45%; background: #ffffff"></div></div>
              </sc-if>
            </div>
            <span style="display: block; margin-top: 12px; font-size: 16px; line-height: 22px; font-weight: 500; color: #211922; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{item.title}}</span>
            <span style="display: block; margin-top: 4px; font-size: 14px; color: #62625b">{{item.date}}</span>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const tones = ['#d9d6cf','#cfd6d9','#d6d9cf','#d9cfd4','#cfd3d9','#d9d4cf','#d2d9cf','#d5cfd9'];
const rows = [
['設計レビューの進め方 ─ 実例で見る 12 のポイント','2026年11月18日','18:42',true],
['ローカル LLM を家庭内サーバーで動かす','2026年11月11日','24:05',false],
['SQLite の WAL を正しく理解する','2026年11月4日','12:37',false],
['Next.js 16 の App Router 移行メモ','2026年10月28日','31:10',true],
['写真ライブラリを 10 年分整理した話','2026年10月21日','15:58',false],
['字幕つき動画を検索できるようにする','2026年10月14日','9:21',false],
['家庭 LAN のバックアップ構成 2026','2026年10月7日','27:46',false],
['Docker Compose で小さく運用する','2026年9月30日','20:13',false]
];
return {
channel: '[チャンネル名]',
items: rows.map((r, i) => ({ title: r[0], date: r[1], duration: r[2], progress: r[3], tone: tones[i] }))
};
}
}
</script>
</body>
</html>
