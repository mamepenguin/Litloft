<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>動画 ライブラリ 390px 案B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.btn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid rgba(145,145,140,.2);background:#fff;border-radius:16px;padding:0 14px;min-height:44px;box-sizing:border-box;font-size:14px;color:#62625b;font-family:inherit;cursor:pointer;text-align:left}
.btn b{font-weight:400;color:#211922;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.v{display:flex;flex-direction:column;gap:6px;width:160px;flex-shrink:0}
.th{width:160px;height:90px;border-radius:10px;background:#f6f6f3}
.vt{font-size:13px;line-height:1.35}
.sec{font-size:12px;color:#62625b;padding:14px 20px 6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;font-size:15px;color:#211922;padding:0 20px;min-height:44px;font-family:inherit;text-align:left;cursor:pointer}
.opt .ck{width:16px;height:16px;flex-shrink:0}
.opt .r{margin-left:auto;color:#62625b;font-size:14px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;position:relative;overflow:hidden">
<div style="padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:10px">
<div style="width:32px;height:32px;border-radius:9px;background:#f6f6f3"></div>
<h1 style="margin:0;font-size:20px;font-weight:700">動画</h1>
<div style="flex:1"></div>
<span style="font-size:14px;color:#62625b">すべての動画 ▾</span>
</div>
<div style="display:flex;gap:24px;border-bottom:1px solid rgba(145,145,140,.2)">
<span style="font-size:14px;color:#62625b;padding:8px 0">発見</span>
<span style="font-size:14px;font-weight:600;padding:8px 0;border-bottom:2px solid #211922">ライブラリ</span>
</div>
<button class="btn" type="button" aria-label="表示: {{summary}}" onClick="{{openSheet}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>
<b>{{summary}}</b>
<sc-if value="{{filtered}}" hint-placeholder-val="{{ true }}"><span style="background:#211922;color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px">{{filterCount}}</span></sc-if>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:16px;font-weight:600">旅行</span><span style="font-size:12px;color:#62625b">42</span><div style="flex:1"></div><span style="font-size:12px;color:#62625b">すべて見る ›</span></div>
<div style="display:flex;gap:12px">
<div class="v"><div class="th"></div><div class="vt">京都 紅葉めぐり</div></div>
<div class="v"><div class="th"></div><div class="vt">北海道ドライブ 1 日目</div></div>
<div class="v"><div class="th"></div><div class="vt">沖縄の海</div></div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:16px;font-weight:600">講演</span><span style="font-size:12px;color:#62625b">17</span><div style="flex:1"></div><span style="font-size:12px;color:#62625b">すべて見る ›</span></div>
<div style="display:flex;gap:12px">
<div class="v"><div class="th"></div><div class="vt">データベースの設計入門</div></div>
<div class="v"><div class="th"></div><div class="vt">チームで書くドキュメント</div></div>
<div class="v"><div class="th"></div><div class="vt">分散システムの基礎</div></div>
</div>
</div>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:rgba(0,0,0,.32)"></div>
<div role="dialog" aria-label="表示" style="position:absolute;left:0;right:0;bottom:0;max-height:640px;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding-bottom:24px">
<div style="display:flex;align-items:center;padding:14px 20px 4px"><span style="font-size:17px;font-weight:700">表示</span><div style="flex:1"></div><button type="button" onClick="{{closeSheet}}" style="border:0;background:transparent;font-size:15px;color:#211922;font-family:inherit;min-height:44px;cursor:pointer">完了</button></div>
<div class="sec">タグ</div>
<button class="opt" type="button"><span class="ck"></span>タグ<span class="r">指定なし ›</span></button>
<div class="sec">状態</div>
<sc-for list="{{states}}" as="o" hint-placeholder-count="4">
<button class="opt" type="button" onClick="{{o.pick}}"><span class="ck"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#211922" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>{{o.label}}</button>
</sc-for>
<div style="height:1px;background:rgba(145,145,140,.2);margin:10px 20px 0"></div>
<div class="sec">分類</div>
<sc-for list="{{groups}}" as="o" hint-placeholder-count="5">
<button class="opt" type="button" onClick="{{o.pick}}"><span class="ck"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#211922" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>{{o.label}}</button>
</sc-for>
<div class="sec">並び順</div>
<sc-for list="{{sorts}}" as="o" hint-placeholder-count="4">
<button class="opt" type="button" onClick="{{o.pick}}"><span class="ck"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#211922" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>{{o.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: true, state: 'unwatched', group: 'folder', sort: 'newest' };
}
renderVals() {
const S = { all: 'すべて', unwatched: '未視聴', in_progress: '視聴中', finished: '視聴済み' };
const G = { folder: 'フォルダ', tag: 'タグ', month: '追加日', duration: '長さ', none: 'なし' };
const O = { newest: '追加日（新しい順）', oldest: '追加日（古い順）', title: 'タイトル', size: 'サイズ' };
const st = this.state;
const list = (m, key) => Object.keys(m).map((id) => ({ label: m[id], on: st[key] === id, pick: () => this.setState({ [key]: id }) }));
const parts = [];
if (st.state !== 'all') parts.push(S[st.state]);
parts.push(G[st.group]);
parts.push(O[st.sort]);
const filterCount = st.state !== 'all' ? 1 : 0;
return {
open: st.open,
openSheet: () => this.setState({ open: true }),
closeSheet: () => this.setState({ open: false }),
summary: parts.join(' ・ '),
filtered: filterCount > 0,
filterCount: String(filterCount),
states: list(S, 'state'),
groups: list(G, 'group'),
sorts: list(O, 'sort')
};
}
}
</script>
</body>
</html>
