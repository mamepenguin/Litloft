<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>対象ごとに覚える</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tb{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(145,145,140,.2);background:#fff;border-radius:16px;padding:8px 12px;font-size:14px;color:#62625b;white-space:nowrap;font-family:inherit;cursor:pointer}
.tb b{font-weight:400;color:#211922}
.tb svg{width:16px;height:16px;flex-shrink:0}
.quiet{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;border-radius:12px;padding:4px 8px;font-size:14px;color:#62625b;font-family:inherit;cursor:pointer}
.quiet:hover{background:#f6f6f3}
.quiet svg{width:14px;height:14px}
.menu{position:absolute;top:44px;left:0;z-index:5;min-width:220px;background:#fff;border:1px solid rgba(145,145,140,.2);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column}
.menu .h{font-size:12px;color:#62625b;padding:6px 10px}
.row{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;font-size:14px;color:#211922;padding:8px 10px;border-radius:10px;font-family:inherit;cursor:pointer}
.row:hover{background:#f6f6f3}
.row .ck{width:16px;height:16px;flex-shrink:0}
.card{width:180px;display:flex;flex-direction:column;gap:6px}
.cover{width:180px;height:135px;border-radius:12px;background:#f6f6f3}
.ct{font-size:13px;line-height:1.35;color:#211922}
.cs{font-size:12px;color:#62625b}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
</style>
</helmet>
<div style="width:1280px;height:900px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;display:flex">
<div style="flex:1 1 auto;min-width:0;padding:32px 40px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:36px;height:36px;border-radius:10px;background:#f6f6f3;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62625b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg></div>
<h1 style="margin:0;font-size:24px;font-weight:700">Clips</h1>
<span style="font-size:14px;color:#62625b">{{count}} 件</span>
<div style="flex:1"></div>
<div style="position:relative">
<button class="quiet" type="button" aria-label="対象: {{targetLabel}}" onClick="{{toggleTarget}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>{{targetLabel}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{openTarget}}" hint-placeholder-val="{{ false }}">
<div class="menu" style="left:auto;right:0">
<sc-for list="{{targets}}" as="o" hint-placeholder-count="3">
<button class="row" type="button" onClick="{{o.pick}}"><span class="ck"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#211922" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>{{o.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</div>
<div style="display:flex;gap:24px;border-bottom:1px solid rgba(145,145,140,.2)">
<span style="font-size:14px;color:#62625b;padding:8px 0">ホーム</span>
<span style="font-size:14px;color:#211922;font-weight:600;padding:8px 0;border-bottom:2px solid #211922">ライブラリ</span>
</div>
<div style="display:flex;gap:8px">
<div style="position:relative">
<button class="tb" type="button" aria-label="分類: {{groupLabel}}" onClick="{{toggleGroup}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect><path d="M14 4h7"></path><path d="M14 9h7"></path><path d="M14 15h7"></path><path d="M14 20h7"></path></svg>分類 <b>{{groupLabel}}</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{openGroup}}" hint-placeholder-val="{{ false }}">
<div class="menu">
<div class="h">分類</div>
<sc-for list="{{groups}}" as="o" hint-placeholder-count="4">
<button class="row" type="button" onClick="{{o.pick}}"><span class="ck"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#211922" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>{{o.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="position:relative">
<button class="tb" type="button" aria-label="並び順: {{sortLabel}}" onClick="{{toggleSort}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="m21 8-4-4-4 4"></path><path d="M17 4v16"></path></svg>並び順 <b>{{sortLabel}}</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{openSort}}" hint-placeholder-val="{{ false }}">
<div class="menu">
<div class="h">並び順</div>
<sc-for list="{{sorts}}" as="o" hint-placeholder-count="3">
<button class="row" type="button" onClick="{{o.pick}}"><span class="ck"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#211922" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>{{o.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:24px;overflow:hidden">
<sc-for list="{{shelves}}" as="s" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:10px">
<sc-if value="{{s.titled}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:17px;font-weight:600">{{s.title}}</span><span class="cs">{{s.count}}</span><div style="flex:1"></div><span class="cs">すべて見る ›</span></div>
</sc-if>
<div style="display:flex;gap:20px;flex-wrap:wrap">
<sc-for list="{{s.cards}}" as="c" hint-placeholder-count="4">
<div class="card"><div class="cover"></div><div class="ct">{{c.t}}</div><div class="cs">{{c.site}}</div></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
<div style="width:340px;flex-shrink:0;box-sizing:border-box;background:#f6f6f3;padding:32px 24px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;color:#62625b">URL</span>
<span class="mono" style="word-break:break-all">{{url}}</span>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;color:#62625b">このブラウザに保存（対象ごと）</span>
<sc-for list="{{stored}}" as="r" hint-placeholder-count="3">
<div style="background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:13px;font-weight:600">{{r.label}}</span>
<span style="font-size:12px;color:#62625b">分類 {{r.group}} ・ 並び順 {{r.sort}}</span>
</div>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;color:#62625b">直前の出来事</span>
<span style="font-size:13px;line-height:1.5">{{log}}</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
target: 'recipes',
open: null,
store: { recipes: { group: 'tags' }, reading: { group: 'none', sort: 'newest' } },
url: null,
log: '「レシピ」を開いた。URL に指定がないので、保存値（分類 タグ）と既定（並び順 追加日（新しい順））で表示し、URL に書き足した（保存はしない）。'
};
}
renderVals() {
const T = { default: 'すべてのクリップ', recipes: 'レシピ', reading: '読みかけ' };
const G = { tags: 'タグ', folder: 'フォルダ', month: '追加日', none: 'なし' };
const S = { newest: '追加日（新しい順）', oldest: '追加日（古い順）', title: 'タイトル' };
const st = this.state;
const saved = st.store[st.target] || {};
const group = (st.url && st.url.group) || saved.group || 'tags';
const sort = (st.url && st.url.sort) || saved.sort || 'newest';
const close = () => this.setState({ open: null });
const toggle = (k) => () => this.setState({ open: st.open === k ? null : k });
const choose = (field, value) => () => {
const entry = Object.assign({}, st.store[st.target] || {});
entry[field] = value;
const store = Object.assign({}, st.store);
store[st.target] = entry;
const url = { group, sort };
url[field] = value;
this.setState({ store, url, open: null, log: '「' + T[st.target] + '」で' + (field === 'group' ? '分類' : '並び順') + 'を「' + (field === 'group' ? G[value] : S[value]) + '」にした。この対象の分だけ保存し、URL に入れた（履歴に積む）。' });
};
const pickTarget = (id) => () => {
const s2 = st.store[id] || {};
const why = s2.group || s2.sort ? '保存値' : '保存がないのでアプリの既定値';
this.setState({ target: id, url: null, open: null, log: '対象を「' + T[id] + '」に切り替えた。URL の分類・並び順を外し（履歴は積まない）、' + why + 'で表示。保存は書き換えない。' });
};
const titles = {
tags: [['鶏肉', 12], ['パスタ', 7], ['タグなし', 3]],
folder: [['レシピ', 15], ['記事', 5], ['Inbox', 2]],
month: [['2026年11月', 9], ['2026年10月', 8], ['2026年9月', 5]]
};
const names = ['鶏むね肉の塩レモン焼き', '和風きのこパスタ', '週末の作り置き 5 品', '15 分でできる麻婆豆腐', 'トマト煮込みハンバーグ', '鯖の味噌煮'];
const sites = ['cookpad.com', 'kurashiru.com', 'delishkitchen.tv', 'nhk.or.jp'];
const ordered = sort === 'title' ? names.slice().sort() : sort === 'oldest' ? names.slice().reverse() : names;
const cards = (n, off) => ordered.slice(off, off + n).map((t, i) => ({ t, site: sites[(i + off) % sites.length] }));
const shelves = group === 'none'
? [{ titled: false, title: '', count: '', cards: ordered.map((t, i) => ({ t, site: sites[i % sites.length] })) }]
: titles[group].map((x, i) => ({ titled: true, title: x[0], count: String(x[1]), cards: cards(4, i) }));
const label = (v, m) => v ? m[v] : '未保存';
return {
count: 27,
targetLabel: T[st.target],
groupLabel: G[group],
sortLabel: S[sort],
openTarget: st.open === 'target', openGroup: st.open === 'group', openSort: st.open === 'sort',
toggleTarget: toggle('target'), toggleGroup: toggle('group'), toggleSort: toggle('sort'),
targets: Object.keys(T).map((id) => ({ label: T[id], on: id === st.target, pick: pickTarget(id) })),
groups: Object.keys(G).map((id) => ({ label: G[id], on: id === group, pick: choose('group', id) })),
sorts: Object.keys(S).map((id) => ({ label: S[id], on: id === sort, pick: choose('sort', id) })),
shelves,
url: '/drive/main/addons/knowledge/clips?view=all&group=' + group + '&sort=' + sort,
stored: Object.keys(T).map((id) => ({ label: T[id], group: label((st.store[id] || {}).group, G), sort: label((st.store[id] || {}).sort, S) })),
log: st.log,
close
};
}
}
</script>
</body>
</html>
