<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>字幕一覧（スマートフォン）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#d63031}a:hover{color:#b52425}
</style>
</helmet>
<div style="width: 375px; height: 600px; box-sizing: border-box; background: #ffffff; color: #211922; font-family: -apple-system, system-ui, 'Segoe UI', 'ヒラギノ角ゴ Pro W3', Meiryo, sans-serif; display: flex; flex-direction: column">
  <div style="height: 190px; background: #33332e"></div>
  <div style="display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid rgba(145,145,140,0.2)">
    <span style="padding: 10px 12px; font-size: 14px; font-weight: 600; border-bottom: 2px solid #211922">情報</span>
    <span style="padding: 10px 12px; font-size: 14px; color: #62625b">関連</span>
  </div>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 24px">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 12px; font-weight: 500; color: #62625b">字幕</h3>
      <div style="font-size: 14px; color: #62625b">字幕はありません</div>
      <div>
        <button style="min-height: 44px; padding: 8px 16px; border: 0; border-radius: 16px; background: #e5e5e0; color: #211922; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          字幕を追加
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 12px; font-weight: 500; color: #62625b">字幕 <span style="font-weight: 400">1</span></h3>
      <ul style="list-style: none; margin: 0; padding: 0">
        <li style="display: flex; align-items: center; padding: 4px 0 4px 10px; border-radius: 12px">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 14px">日本語</div>
            <div style="font-size: 12px; color: #62625b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">The Long Night.ja.srt</div>
          </div>
          <div style="display: flex">
            <button aria-label="日本語の字幕を差し替え" style="width: 44px; height: 44px; border: 0; background: transparent; color: #211922; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
            </button>
            <button aria-label="日本語の字幕を削除" style="width: 44px; height: 44px; border: 0; background: transparent; color: #9e0a0a; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </li>
      </ul>
      <div role="alert" style="display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(230,0,35,0.08); color: #9e0a0a; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
        <span>UTF-8 で保存された字幕ではありません。</span>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
