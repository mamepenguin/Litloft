<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検索ページの除外チップ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#62625b}a:hover{color:#211922}
</style>
</helmet>
<div style="width: 1280px; height: 520px; box-sizing: border-box; background: #ffffff; color: #211922; font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; padding: 32px 48px; display: flex; flex-direction: column; gap: 40px">
  <sc-for list="{{variants}}" as="v" hint-placeholder-count="3">
    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="font-size: 12px; font-weight: 600; color: #62625b; width: 16px">{{v.id}}</span>
        <label style="flex: 1; display: flex">
          <input type="text" value="tag:旅行 -tag:2023 -path:写真/raw -has:collection 京都" aria-label="検索" style="flex: 1; height: 40px; box-sizing: border-box; border: 1px solid rgba(145,145,140,0.35); border-radius: 12px; padding: 0 14px; font-size: 15px; color: #211922; background: #ffffff; font-family: inherit">
        </label>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 28px">
        <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e5e5e0; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
          <span><b style="font-weight: 600">タグ</b> 旅行</span>
          <button type="button" aria-label="タグ 旅行 を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
        </span>

        <sc-if value="{{v.isA}}" hint-placeholder-val="{{ true }}">
          <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 1px #b9b9b2; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
            <span><span style="color: #62625b">除外</span> <b style="font-weight: 600">タグ</b> 2023</span>
            <button type="button" aria-label="除外 タグ 2023 を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 1px #b9b9b2; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
            <span><span style="color: #62625b">除外</span> <b style="font-weight: 600">フォルダ</b> 写真/raw</span>
            <button type="button" aria-label="除外 フォルダ 写真/raw を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
          </span>
        </sc-if>

        <sc-if value="{{v.isB}}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e5e5e0; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
            <span><b style="font-weight: 600">−タグ</b> 2023</span>
            <button type="button" aria-label="除外 タグ 2023 を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e5e5e0; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
            <span><b style="font-weight: 600">−フォルダ</b> 写真/raw</span>
            <button type="button" aria-label="除外 フォルダ 写真/raw を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
          </span>
        </sc-if>

        <sc-if value="{{v.isC}}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e5e5e0; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
            <span><b style="font-weight: 600">タグ</b> <s style="color: #62625b">2023</s></span>
            <button type="button" aria-label="除外 タグ 2023 を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e5e5e0; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
            <span><b style="font-weight: 600">フォルダ</b> <s style="color: #62625b">写真/raw</s></span>
            <button type="button" aria-label="除外 フォルダ 写真/raw を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
          </span>
        </sc-if>

        <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e5e5e0; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 16px">
          <span><b style="font-weight: 600">コレクション未登録</b></span>
          <button type="button" aria-label="コレクション未登録 を外す" style="border: 0; background: transparent; color: #62625b; border-radius: 999px; padding: 2px; font-size: 12px; line-height: 12px; cursor: pointer">×</button>
        </span>
        <button type="button" style="display: inline-flex; align-items: center; border-radius: 999px; border: 1px dashed #91918c; background: transparent; padding: 4px 10px; font-size: 12px; color: #62625b; font-family: inherit; cursor: pointer">＋ 条件</button>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      variants: [
        { id: 'A', isA: true, isB: false, isC: false },
        { id: 'B', isA: false, isB: true, isC: false },
        { id: 'C', isA: false, isB: false, isC: true }
      ]
    };
  }
}
</script>
</body>
</html>
