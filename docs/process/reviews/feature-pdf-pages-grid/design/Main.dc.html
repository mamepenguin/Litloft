<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PDF ページ一覧 3 列</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#62625b}a:hover{color:#211922}
.tile:hover{background:#f6f6f3}
</style>
</helmet>
<div style="width: 384px; height: 820px; box-sizing: border-box; background: #ffffff; font-family: Inter, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; color: #211922; display: flex; flex-direction: column; border-left: 1px solid rgba(145,145,140,0.2)">
  <div style="display: flex; gap: 4px; padding: 0 8px; border-bottom: 1px solid rgba(145,145,140,0.2)">
    <button style="all: unset; padding: 10px 12px; font-size: 12px; font-weight: 500; color: #62625b; border-bottom: 2px solid transparent">Info</button>
    <button style="all: unset; padding: 10px 12px; font-size: 12px; font-weight: 500; color: #211922; border-bottom: 2px solid #d63031">Pages</button>
    <button style="all: unset; padding: 10px 12px; font-size: 12px; font-weight: 500; color: #62625b; border-bottom: 2px solid transparent">Related</button>
    <button style="all: unset; padding: 10px 12px; font-size: 12px; font-weight: 500; color: #62625b; border-bottom: 2px solid transparent">Ask</button>
  </div>
  <ol style="list-style: none; margin: 0; padding: 12px; display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); column-gap: 8px; row-gap: 12px; align-items: start; overflow: hidden; flex: 1">
    <sc-for list="{{pages}}" as="p" hint-placeholder-count="12">
      <li style="min-width: 0">
        <button class="tile" aria-label="{{p.label}}" style="all: unset; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px; border-radius: 8px; cursor: pointer">
          <div style="{{p.pageStyle}}">
            <sc-if value="{{p.cover}}" hint-placeholder-val="{{false}}">
              <div style="height: 46%; background: {{p.tint}}"></div>
              <div style="padding: 8% 10%; display: flex; flex-direction: column; gap: 4px">
                <div style="height: 5px; width: 80%; background: #211922; opacity: .8"></div>
                <div style="height: 3px; width: 55%; background: #91918c"></div>
              </div>
            </sc-if>
            <sc-if value="{{p.text}}" hint-placeholder-val="{{true}}">
              <div style="padding: 10% 10%; display: flex; flex-direction: column; gap: 3px">
                <div style="height: 4px; width: 60%; background: #211922; opacity: .7; margin-bottom: 3px"></div>
                <div style="height: 2px; background: #c9c9c4"></div>
                <div style="height: 2px; background: #c9c9c4"></div>
                <div style="height: 2px; width: 90%; background: #c9c9c4"></div>
                <div style="height: 2px; background: #c9c9c4"></div>
                <div style="height: 2px; width: 70%; background: #c9c9c4"></div>
                <div style="height: 2px; background: #c9c9c4; margin-top: 4px"></div>
                <div style="height: 2px; width: 85%; background: #c9c9c4"></div>
                <div style="height: 2px; background: #c9c9c4"></div>
              </div>
            </sc-if>
            <sc-if value="{{p.figure}}" hint-placeholder-val="{{false}}">
              <div style="padding: 10% 10%; display: flex; flex-direction: column; gap: 3px">
                <div style="height: 2px; background: #c9c9c4"></div>
                <div style="height: 2px; width: 80%; background: #c9c9c4"></div>
                <div style="height: 34px; background: {{p.tint}}; opacity: .55; margin: 4px 0"></div>
                <div style="height: 2px; background: #c9c9c4"></div>
                <div style="height: 2px; width: 60%; background: #c9c9c4"></div>
              </div>
            </sc-if>
            <sc-if value="{{p.sparse}}" hint-placeholder-val="{{false}}">
              <div style="padding: 10% 10%; display: flex; flex-direction: column; gap: 3px">
                <div style="height: 2px; width: 70%; background: #c9c9c4"></div>
                <div style="height: 2px; width: 40%; background: #c9c9c4"></div>
              </div>
            </sc-if>
          </div>
          <span style="{{p.numStyle}}">{{p.n}}</span>
        </button>
      </li>
    </sc-for>
  </ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":384,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const kinds = ['cover','text','text','figure','text','sparse','text','figure','text','text','figure','text','text','text','sparse'];
    const tints = ['#e85d5e','#4b6cb7','#e8a33d','#4caf80'];
    const current = 5;
    const pages = kinds.map((k, i) => {
      const n = i + 1;
      const cur = n === current;
      const landscape = n === 9;
      const pageStyle = [
        'width: 100%',
        'aspect-ratio: ' + (landscape ? '1.414 / 1' : '1 / 1.414'),
        'background: #ffffff',
        'overflow: hidden',
        'border-radius: 3px',
        'box-sizing: border-box',
        cur ? 'outline: 2px solid #d63031; outline-offset: 2px; border: 1px solid rgba(145,145,140,0.4)' : 'border: 1px solid rgba(145,145,140,0.4)'
      ].join('; ');
      const numStyle = cur
        ? 'font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 16px; font-weight: 600; color: #d63031'
        : 'font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 16px; color: #62625b';
      return {
        n, label: n + ' ページへ移動', pageStyle, numStyle,
        cover: k === 'cover', text: k === 'text', figure: k === 'figure', sparse: k === 'sparse',
        tint: tints[i % tints.length]
      };
    });
    return { cols: 3, pages };
  }
}
</script>
</body>
</html>
