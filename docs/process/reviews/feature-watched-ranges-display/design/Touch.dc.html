<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スキップ中の帯 スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 220px; position: relative; overflow: hidden; background: #0e1116; font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; color: #ffffff">
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 35%, #3a4a5c 0%, #1b2430 45%, #0e1116 100%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.5) 55%, rgba(0,0,0,0))"></div>
<div aria-hidden="true" style="position: absolute; right: 0; top: 0; bottom: 0; width: 38%; border-radius: 9999px 0 0 9999px; background: rgba(255,255,255,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
<span style="font-size: 13px; font-weight: 500">20秒</span>
</div>
<div style="position: absolute; left: 12px; right: 4px; bottom: 36px; height: 44px; display: flex; align-items: center">
<span style="font-size: 12px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.9)">25:20 <span style="color: rgba(255,255,255,0.5)">/</span> 42:10</span>
<div style="flex: 1"></div>
<button type="button" aria-label="全画面" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
</button>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 40px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 17px; height: 3px">
<sc-for list="{{spans}}" as="s" hint-placeholder-count="6">
<div style="position: absolute; top: 0; height: 3px; border-radius: 1px; left: {{s.left}}; width: {{s.width}}; background: {{s.color}}"></div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; top: 24px; height: 12px">
<div style="position: absolute; left: 0; right: 0; top: 4px; height: 4px; border-radius: 9999px; overflow: hidden; background: rgba(255,255,255,0.25)">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 72%; background: rgba(255,255,255,0.4)"></div>
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{playedPct}}; background: {{indicator}}"></div>
</div>
<div style="position: absolute; top: 0; width: 12px; height: 12px; border-radius: 9999px; transform: translateX(-50%); left: {{playedPct}}; background: {{indicator}}"></div>
</div>
<input type="range" aria-label="シーク" min="0" max="2530" value="1520" style="position: absolute; inset: 0; opacity: 0; width: 100%; margin: 0">
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const dur = 2530;
    const level = ['', 'rgba(255,255,255,0.35)', 'rgba(255,255,255,0.6)', 'rgba(255,255,255,0.9)'];
    const raw = [[0,420,1],[420,610,3],[900,1500,1],[1500,1580,2],[2100,2200,1]];
    const spans = raw.map(function (r) {
      return { left: (r[0] / dur * 100) + '%', width: ((r[1] - r[0]) / dur * 100) + '%', color: level[r[2]] };
    });
    const dark = (this.props.theme ?? 'light') === 'dark';
    return { spans: spans, playedPct: (1520 / dur * 100) + '%', indicator: dark ? '#ffffff' : '#d63031' };
  }
}
</script>
</body>
</html>
