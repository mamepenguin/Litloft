<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ノート ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#ffffff}
a{color:#211922;text-decoration:none}a:hover{color:#211922}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm{width:14px;height:14px}
.side a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;font-size:15px;color:#211922}
.side a.on{background:#f6f6f3;font-weight:600}
.row{display:flex;align-items:flex-start;gap:14px;padding:12px 12px;border-radius:12px}
.row:hover{background:#f6f6f3}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:#f6f6f3;font-size:12px;color:#62625b;white-space:nowrap}
</style>
</helmet>
<div style="min-height: 1180px; display: flex; flex-wrap: wrap; font-family: -apple-system, system-ui, 'Hiragino Sans', 'Segoe UI', sans-serif; color: #211922; background: #ffffff">

  <nav class="side" aria-label="サイドバー" style="flex: 1 1 240px; max-width: 240px; box-sizing: border-box; border-right: 1px solid rgba(145,145,140,0.2); padding: 64px 12px 24px; display: flex; flex-direction: column; gap: 2px">
    <a href="#">ホーム</a>
    <a href="#">Inbox</a>
    <a href="#">ライブラリ</a>
    <a href="#">動画</a>
    <a href="#">読む</a>
    <a href="#">Ask</a>
    <a href="#" class="on">ノート</a>
    <a href="#">Clips</a>
    <a href="#">Photo Diary</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="height: 56px; border-bottom: 1px solid rgba(145,145,140,0.2)"></div>

    <div style="width: 100%; max-width: 1120px; box-sizing: border-box; padding: 28px 40px 64px; margin: 0 auto">

      <header style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px">
        <div style="display: flex; align-items: center; gap: 12px; flex: 1 1 320px; min-width: 0">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #f6f6f3; display: flex; align-items: center; justify-content: center">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>
          </span>
          <div style="min-width: 0">
            <h1 style="margin: 0; font-size: 24px; line-height: 1.3; font-weight: 700">ノート</h1>
            <div style="margin-top: 2px; font-size: 14px; color: #62625b">main · 152 件</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px">
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #62625b">
            <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg>
            すべてのノート
            <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #d63031; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600">
            <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            新しいノート
          </button>
        </div>
      </header>

      <nav aria-label="ノートの表示" style="margin-top: 20px; display: flex; gap: 4px; border-bottom: 1px solid rgba(145,145,140,0.2)">
        <a href="#" style="padding: 10px 16px; font-size: 15px; font-weight: 600; border-bottom: 2px solid #d63031; margin-bottom: -1px">ホーム</a>
        <a href="NotesLibrary.dc.html" style="padding: 10px 16px; font-size: 15px; color: #62625b">ライブラリ</a>
      </nav>

      <section style="margin-top: 40px">
        <h2 style="margin: 0 0 16px; font-size: 20px; font-weight: 700">続きを書く</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px">
          <sc-for list="{{desk}}" as="n" hint-placeholder-count="4">
            <a href="#" style="display: block; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(33,25,34,0.04), 0 1px 3px rgba(33,25,34,0.04); outline: 1px solid rgba(145,145,140,0.2); overflow: hidden">
              <div style="height: 132px; background: #f6f6f3; padding: 16px 16px 0; box-sizing: border-box">
                <div style="height: 100%; background: #ffffff; border: 1px solid rgba(145,145,140,0.2); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 12px 14px; box-sizing: border-box; overflow: hidden">
                  <p style="margin: 0; font-size: 10.5px; line-height: 1.75; color: #62625b; white-space: pre-line">{{n.body}}</p>
                </div>
              </div>
              <div style="padding: 14px">
                <div style="font-size: 14px; font-weight: 600; line-height: 1.45">{{n.title}}</div>
                <div style="margin-top: 4px; font-size: 12px; color: #62625b">{{n.meta}}</div>
              </div>
            </a>
          </sc-for>
        </div>
      </section>

      <section style="margin-top: 48px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700">出典つきメモ</h2>
          <a href="NotesLibrary.dc.html" style="font-size: 14px; color: #62625b">すべて表示 ›</a>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{cited}}" as="n" hint-placeholder-count="3">
            <li>
              <a href="#" class="row">
                <span style="width: 96px; height: 54px; border-radius: 8px; background: {{n.tint}}; flex-shrink: 0; position: relative">
                  <span style="position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 6px; background: rgba(0,0,0,0.7); color: #ffffff; font-size: 10px; font-variant-numeric: tabular-nums">{{n.at}}</span>
                </span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                  <span style="font-size: 15px; font-weight: 600; line-height: 1.45">{{n.title}}</span>
                  <span style="margin-top: 2px; font-size: 13px; color: #62625b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.excerpt}}</span>
                  <span style="margin-top: 6px; font-size: 12px; color: #62625b">{{n.source}}</span>
                </span>
                <span style="font-size: 12px; color: #62625b; font-variant-numeric: tabular-nums; align-self: center">{{n.time}}</span>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>

      <section style="margin-top: 48px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700">最近更新したノート</h2>
          <a href="NotesLibrary.dc.html" style="font-size: 14px; color: #62625b">ライブラリで見る ›</a>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{recent}}" as="n" hint-placeholder-count="5">
            <li>
              <a href="#" class="row">
                <span style="width: 36px; height: 36px; border-radius: 12px; background: #f6f6f3; color: #62625b; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                </span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                  <span style="font-size: 15px; font-weight: 600; line-height: 1.45">{{n.title}}</span>
                  <span style="margin-top: 2px; font-size: 13px; color: #62625b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.excerpt}}</span>
                </span>
                <span style="width: 176px; font-size: 12px; color: #62625b; align-self: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.folder}}</span>
                <span style="width: 64px; text-align: right; font-size: 12px; color: #62625b; font-variant-numeric: tabular-nums; align-self: center">{{n.time}}</span>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      desk: [
        { title: 'キーボード', meta: 'メモ/雑多なメモ · 今日', body: '候補を 3 つに絞った。\n打鍵感は店で確かめる。\n・配列は US\n・テンキーなし\n・静音軸' },
        { title: '点呼アプリの画面遷移', meta: 'Knowledge/点呼アプリ · 昨日', body: '起動 → 当日の一覧\n未回答の人だけ先頭に\n通知は 1 回だけ\n\n次: 管理者画面' },
        { title: '読んだ本のメモ', meta: 'メモ · 3 日前', body: '第 2 章まで。\n「測れないものは直せない」\nの節を後で引用する。' },
        { title: '旅行の持ち物', meta: 'Inbox · 5 日前', body: '充電器\n変換プラグ\n常備薬\n折りたたみ傘' }
      ],
      cited: [
        { title: '動画メモ: 圧力鍋の使い方', excerpt: '加圧 8 分、自然放置 10 分。蓋は冷めるまで開けない。', source: '動画/料理 · 12:34 から', at: '12:34', time: '2 日前', tint: '#d9d4c7' },
        { title: '講義ノート: 統計の基礎', excerpt: '分散と標準偏差の違い。外れ値に弱いのはどちらか。', source: '動画/学問 · 3 か所', at: '41:02', time: '1 週間前', tint: '#c9d3cf' },
        { title: '本の引用: 第 3 章', excerpt: '「設計は削ることから始まる」— 64 ページ', source: 'Books · 64 ページ', at: 'p.64', time: '2 週間前', tint: '#e3d8cf' }
      ],
      recent: [
        { title: '一日の振り返り', excerpt: '一日の終わりに良かったことを 3 つ書く。', folder: 'メモ/雑多なメモ', time: '11月12日' },
        { title: 'Litloft の計画', excerpt: 'アプリごとに見せ方を変える。ノートは本文を読む場所。', folder: 'Knowledge/Litloft', time: '11月10日' },
        { title: 'シリーズの時系列', excerpt: '発売順と作中の時系列を並べて比べる。', folder: 'メモ/雑多なメモ', time: '11月8日' },
        { title: '私の思想 / 道具について', excerpt: '道具は手に馴染むまで使い込んでから評価する。', folder: 'メモ/私の思想', time: '11月2日' },
        { title: 'SQLite の WAL', excerpt: '読み手は -wal と -shm も要る。ファイル単体でマウントしない。', folder: 'Knowledge/Engineering', time: '10月28日' }
      ]
    };
  }
}
</script>
</body>
</html>
