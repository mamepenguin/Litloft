<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ノート ライブラリ スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#ffffff}
a{color:#211922;text-decoration:none}a:hover{color:#211922}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sm{width:14px;height:14px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: -apple-system, system-ui, 'Hiragino Sans', 'Segoe UI', sans-serif; color: #211922; background: #ffffff">
  <div style="height: 56px; border-bottom: 1px solid rgba(145,145,140,0.2); display: flex; align-items: center; padding: 0 16px">
    <button type="button" aria-label="メニュー" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: #f6f6f3; display: flex; align-items: center; justify-content: center; color: #211922">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
    </button>
  </div>

  <div style="padding: 20px 16px 0">
    <header style="display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #f6f6f3; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700">ノート</h1>
        <div style="display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 14px; color: #62625b">
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">main · 152 件</span>
        </div>
      </div>
      <button type="button" aria-label="対象: すべてのノート" style="display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 8px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #62625b">
        <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg>
        すべて
        <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </header>

    <nav aria-label="ノートの表示" style="margin-top: 16px; display: flex; gap: 4px; border-bottom: 1px solid rgba(145,145,140,0.2)">
      <a href="Main.dc.html" style="padding: 10px 14px; font-size: 15px; color: #62625b">ホーム</a>
      <a href="#" style="padding: 10px 14px; font-size: 15px; font-weight: 600; border-bottom: 2px solid #d63031; margin-bottom: -1px">ライブラリ</a>
    </nav>

    <button type="button" style="margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border: 0; border-radius: 999px; background: #d63031; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600">
      <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      新しいノート
    </button>

    <div style="margin-top: 16px; display: flex; gap: 8px">
      <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: #e5e5e0; font: inherit; font-size: 13px; color: #211922; min-width: 0">
        <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true" style="color: #62625b"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">フォルダ: 雑多なメモ</span>
        <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid rgba(145,145,140,0.35); border-radius: 999px; background: #ffffff; font: inherit; font-size: 13px; color: #62625b; flex-shrink: 0">更新順</button>
    </div>

    <label style="margin-top: 10px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid rgba(145,145,140,0.35); border-radius: 999px; font-size: 14px; color: #62625b">
      <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="雑多なメモ を検索" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; background: transparent; color: #211922">
    </label>

    <ul style="list-style: none; margin: 8px -16px 0; padding: 0">
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="6">
        <li>
          <a href="#" style="display: block; padding: 12px 16px; border-bottom: 1px solid rgba(145,145,140,0.2)">
            <span style="display: flex; align-items: baseline; gap: 8px">
              <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span>
              <span style="font-size: 12px; color: #62625b; font-variant-numeric: tabular-nums">{{n.time}}</span>
            </span>
            <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; font-size: 13px; line-height: 1.55; color: #62625b">{{n.excerpt}}</span>
          </a>
        </li>
      </sc-for>
    </ul>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      notes: [
        { title: 'キーボード', time: '今日', excerpt: '候補を 3 つに絞った。打鍵感は店で確かめてから決める。条件は US 配列、テンキーなし。' },
        { title: '一日の振り返り', time: '11月12日', excerpt: '一日の終わりに良かったことを 3 つ書く。続けるコツは書く場所を決めておくこと。' },
        { title: 'シリーズの時系列', time: '11月8日', excerpt: '発売順と作中の時系列を並べて比べる。外伝はどこに入るか。' },
        { title: '買い物リスト', time: '11月5日', excerpt: 'キーボード、替えのケーブル、モニターアーム。' },
        { title: '机まわりの整理', time: '11月1日', excerpt: '配線をまとめる。使わないものは箱に入れて一か月様子を見る。' },
        { title: '読みたい本', time: '10月27日', excerpt: '積んである順ではなく、今の仕事に近い順に読む。' }
      ]
    };
  }
}
</script>
</body>
</html>
