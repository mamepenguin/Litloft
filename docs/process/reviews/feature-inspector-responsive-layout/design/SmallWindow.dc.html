<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>小さいウインドウ プレイヤー画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#e85d5e}a:hover{color:#f5e6e8}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:#c4a0a4;padding:0}
.ib.on{background:#2f191b;color:#f5e6e8}
.tab{border:0;background:transparent;color:#c4a0a4;font:inherit;font-size:13px;padding:10px 12px;border-bottom:2px solid transparent}
.tab.on{color:#f5e6e8;border-bottom-color:#e85d5e;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:#c4a0a4;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px}
.row{display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:13px;color:#f5e6e8}
</style>
</helmet>
<div style="width:900px;height:700px;display:flex;flex-direction:column;background:#1a0e10;color:#f5e6e8;font-family:-apple-system,system-ui,'Hiragino Sans','Segoe UI',sans-serif;overflow:hidden">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-pleft" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol>
    <symbol id="i-pbottom" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3l14 9-14 9z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-like" viewBox="0 0 24 24"><path d="M7 10v12M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8a2 2 0 0 1-1.9 1.4H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 12h18"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>

  <header style="height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,0.08)">
    <button class="ib" aria-label="メニュー"><svg class="ic"><use href="#i-menu"/></svg></button>
    <button class="ib" aria-label="フォルダツリー"><svg class="ic"><use href="#i-pleft"/></svg></button>
    <div style="flex:1"></div>
    <button class="ib" aria-label="検索"><svg class="ic"><use href="#i-search"/></svg></button>
    <button class="ib" aria-label="新規ノート"><svg class="ic"><use href="#i-pen"/></svg></button>
    <div style="width:32px;height:32px;border-radius:16px;background:#e85d5e;color:#1a0e10;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-left:4px">S</div>
  </header>

  <div style="height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px;color:#c4a0a4">
    <svg class="ic" style="width:16px;height:16px"><use href="#i-home"/></svg>
    <svg class="ic" style="width:14px;height:14px"><use href="#i-chev"/></svg><span>動画</span>
    <svg class="ic" style="width:14px;height:14px"><use href="#i-chev"/></svg><span>記録</span>
    <svg class="ic" style="width:14px;height:14px"><use href="#i-chev"/></svg><span style="color:#f5e6e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ホームサーバーの構成を見直す</span>
    <div style="flex:1"></div>
    <button class="ib" aria-label="このファイル内を検索"><svg class="ic"><use href="#i-search"/></svg></button>
    <button class="ib on" aria-label="インスペクタ" aria-pressed="true"><svg class="ic"><use href="#i-pbottom"/></svg></button>
  </div>

  <div style="flex:none;padding:16px 16px 12px;display:flex;justify-content:center">
    <div style="width:536px;border-radius:12px;overflow:hidden;background:#000">
      <div style="aspect-ratio:16/9;background:#2b2224;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="padding:0 12px 10px">
          <div style="height:4px;border-radius:2px;background:rgba(255,255,255,0.3);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:31%;background:#fff;border-radius:2px"></div></div>
          <div style="display:flex;align-items:center;gap:14px;margin-top:10px;color:#fff;font-size:12px">
            <svg class="ic" style="width:20px;height:20px"><use href="#i-play"/></svg>
            <svg class="ic"><use href="#i-back"/></svg>
            <svg class="ic"><use href="#i-fwd"/></svg>
            <span>07:32 / 24:18</span>
            <div style="flex:1"></div>
            <svg class="ic"><use href="#i-vol"/></svg>
            <svg class="ic"><use href="#i-gear"/></svg>
            <svg class="ic"><use href="#i-max"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section aria-label="インスペクタ" style="flex:1;min-height:0;display:flex;flex-direction:column;background:#231216;border-top:1px solid rgba(255,255,255,0.08)">
    <div role="tablist" style="display:flex;padding:0 12px;border-bottom:1px solid rgba(255,255,255,0.08);flex:none">
      <button class="tab on" role="tab" aria-selected="true">Info</button>
      <button class="tab" role="tab">Related</button>
      <button class="tab" role="tab">Transcript</button>
      <button class="tab" role="tab">Ask</button>
    </div>
    <div style="flex:1;min-height:0;overflow:hidden;padding:0 0 4px">
    <div style="padding:10px 12px 0 20px;display:flex;align-items:center;gap:12px">
      <h1 style="margin:0;font-size:16px;line-height:1.4;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ホームサーバーの構成を見直す</h1>
      <span style="font-size:12px;color:#c4a0a4;flex:none">24:18</span>
      <div style="flex:1"></div>
      <div style="display:flex;gap:2px;flex:none">
        <button class="chip"><svg class="ic" style="width:16px;height:16px"><use href="#i-like"/></svg>Like</button>
        <button class="chip"><svg class="ic" style="width:16px;height:16px"><use href="#i-star"/></svg>Favorites</button>
        <button class="chip"><svg class="ic" style="width:16px;height:16px"><use href="#i-spark"/></svg>AI</button>
        <button class="chip" aria-label="その他"><svg class="ic" style="width:16px;height:16px"><use href="#i-more"/></svg></button>
      </div>
    </div>
      <button class="chip" style="margin:2px 12px 2px;font-size:12px">+ Add tag</button>
      <div class="row"><svg class="ic" style="width:16px;height:16px;color:#c4a0a4"><use href="#i-film"/></svg><span style="flex:1">Visual index · 24 scenes</span><svg class="ic" style="width:16px;height:16px;color:#c4a0a4"><use href="#i-down"/></svg></div>
      <div class="row"><svg class="ic" style="width:16px;height:16px;color:#c4a0a4"><use href="#i-msg"/></svg><span style="flex:1">Comments</span><svg class="ic" style="width:16px;height:16px;color:#c4a0a4"><use href="#i-down"/></svg></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
