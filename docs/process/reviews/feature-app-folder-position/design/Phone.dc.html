<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>動画 ライブラリ 位置あり スマートフォン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#62625b;text-decoration:none}a:hover{color:#211922}
.ctl{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(145,145,140,.2);background:#fff;border-radius:16px;padding:0 12px;min-height:44px;font-size:14px;color:#62625b;white-space:nowrap;font-family:inherit;box-sizing:border-box}
.ctl b{font-weight:400;color:#211922}
.ctl svg{width:16px;height:16px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#f6f6f3;padding:0 14px;min-height:44px;font-size:14px;color:#211922;white-space:nowrap;flex-shrink:0;box-sizing:border-box}
.chip span{color:#62625b;font-size:13px}
.crumb{display:flex;align-items:center;gap:2px;font-size:14px;color:#62625b;white-space:nowrap;overflow-x:auto}
.crumb a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;flex-shrink:0}
.crumb svg{width:14px;height:14px;flex-shrink:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Hiragino Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid rgba(145,145,140,.2)">
<div style="display:flex;flex-direction:column;gap:2px">
<div style="font-size:13px;color:#62625b">main</div>
<div style="display:flex;align-items:baseline;gap:8px"><h1 style="margin:0;font-size:22px;font-weight:700">動画</h1><span style="font-size:14px;color:#62625b">2,184</span></div>
</div>
<button class="ctl" type="button" style="align-self:flex-start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg><b>すべての動画</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="display:flex;gap:24px;font-size:14px">
<a href="#" style="display:flex;align-items:center;min-height:44px;border-bottom:2px solid transparent;color:#62625b;box-sizing:border-box">発見</a>
<a href="#" style="display:flex;align-items:center;min-height:44px;border-bottom:2px solid #d63031;color:#211922;font-weight:600;box-sizing:border-box">ライブラリ</a>
</div>
</div>

<div style="padding:8px 0 0;display:flex;flex-direction:column;gap:4px">
<nav class="crumb" aria-label="フォルダの位置" style="padding:0 10px">
<a href="#" aria-label="一番上"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
<a href="#">動画</a>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
<span aria-current="page" style="padding:0 6px;color:#211922;font-weight:500">学問</span>
</nav>
<div style="display:flex;gap:8px;overflow-x:auto;padding:0 16px">
<a href="#" class="chip">数学<span>42</span></a>
<a href="#" class="chip">物理<span>18</span></a>
<a href="#" class="chip">化学<span>9</span></a>
<a href="#" class="chip">統計<span>7</span></a>
</div>
</div>

<div style="padding:12px 16px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<button class="ctl" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path></svg><b>指定なし</b></button>
<button class="ctl" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><b>すべて</b></button>
<button class="ctl" type="button" aria-label="分類 フォルダ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect><path d="M14 4h7"></path><path d="M14 9h7"></path><path d="M14 15h7"></path><path d="M14 20h7"></path></svg><b>フォルダ</b></button>
<button class="ctl" type="button" aria-label="並び順 追加日（新しい順）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="m21 8-4-4-4 4"></path><path d="M17 4v16"></path></svg><b>新しい順</b></button>
</div>

<div style="padding:24px 0 0 16px;display:flex;flex-direction:column;gap:28px">
<sc-for list="{{shelves}}" as="s" hint-placeholder-count="2">
<section style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:8px;padding-right:16px">
<h2 style="margin:0;font-size:17px;font-weight:600">{{s.name}}</h2>
<span style="font-size:14px;color:#62625b">{{s.count}}</span>
<div style="flex:1"></div>
<a href="#" style="font-size:14px">すべて見る</a>
</div>
<div style="display:flex;gap:12px;overflow:hidden">
<sc-for list="{{s.items}}" as="v" hint-placeholder-count="3">
<div style="flex:0 0 150px;display:flex;flex-direction:column;gap:6px">
<div style="aspect-ratio:16/9;border-radius:10px;background:{{v.tone}}"></div>
<div style="font-size:13px;line-height:1.4">{{v.title}}</div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tones = ['#e5e5e0', '#e0e0d9', '#d5d5d0'];
const make = (titles) => titles.map((title, i) => ({ title, tone: tones[i % tones.length] }));
return {
shelves: [
{ name: '数学', count: '42', items: make(['線形代数 第1回', '解析学 第3回', '確率論入門']) },
{ name: '物理', count: '18', items: make(['量子力学 第5回', '解析力学', '統計力学']) },
{ name: '化学', count: '9', items: make(['有機化学 反応機構', '量子化学', '物理化学']) }
]
};
}
}
</script>
</body>
</html>
