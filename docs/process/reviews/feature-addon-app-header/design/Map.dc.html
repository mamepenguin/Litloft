<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォトダイアリー 地図</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:1280px;height:860px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue','ヒラギノ角ゴ Pro W3',Meiryo,sans-serif;display:flex">

<aside style="width:240px;flex-shrink:0;background:#f6f6f3;border-right:1px solid rgba(145,145,140,0.2)"></aside>

<main style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">
<header style="padding:8px 16px 0;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:flex-start;gap:12px">
<div style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#f6f6f3;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></div>
<div style="flex:1 1 auto;min-width:0">
<h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700">フォトダイアリー</h1>
<div style="margin-top:4px;font-size:14px;color:#62625b">photos · 1,284枚</div>
</div>
<button type="button" aria-label="対象: カメラの写真" style="display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 8px;border:0;border-radius:12px;background:transparent;color:#62625b;font:inherit;font-size:13px;cursor:pointer;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">カメラの写真</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<nav aria-label="表示" style="display:flex;gap:24px;margin-top:8px;border-bottom:1px solid rgba(145,145,140,0.2)">
<a href="Main.dc.html" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">カレンダー</a>
<a href="Map.dc.html" aria-current="page" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid #d63031;font-size:14px;font-weight:600;color:#211922">地図</a>
</nav>
</header>

<div style="flex:1 1 auto;position:relative;background:#f1eee6;overflow:hidden">
<div style="position:absolute;left:0;right:0;top:46%;height:10px;background:#ffffff"></div>
<div style="position:absolute;top:0;bottom:0;left:38%;width:8px;background:#ffffff"></div>
<div style="position:absolute;left:62%;top:0;bottom:0;width:120px;background:#d7e3ea"></div>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
<div style="position:absolute;left:{{p.x}};top:{{p.y}};width:48px;height:48px;border-radius:10px;border:2px solid #ffffff;background:{{p.bg}};box-shadow:0 1px 3px rgba(33,25,34,0.25)">
<div style="position:absolute;right:-7px;top:-7px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;border:1.5px solid #ffffff;background:#211922;color:#ffffff;font-size:11px;line-height:15px;text-align:center">{{p.n}}</div>
</div>
</sc-for>
<div style="position:absolute;right:8px;bottom:6px;font-size:11px;color:#62625b">© OpenStreetMap contributors</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pins: [
        { x: '22%', y: '30%', n: '42', bg: '#c9b8a6' },
        { x: '44%', y: '52%', n: '7', bg: '#b8c4b0' },
        { x: '52%', y: '24%', n: '118', bg: '#d4c1b4' },
        { x: '30%', y: '70%', n: '3', bg: '#c4c9d4' }
      ]
    };
  }
}
</script>
</body>
</html>
