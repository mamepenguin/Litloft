<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォトダイアリー カレンダー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:1280px;height:860px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue','ヒラギノ角ゴ Pro W3',Meiryo,sans-serif;display:flex">

<aside style="width:240px;flex-shrink:0;background:#f6f6f3;border-right:1px solid rgba(145,145,140,0.2)"></aside>

<main style="flex:1 1 auto;min-width:0">
<header style="padding:8px 16px 0;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:flex-start;gap:12px">
<div style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#f6f6f3;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></div>
<div style="flex:1 1 auto;min-width:0">
<h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700">フォトダイアリー</h1>
<div style="margin-top:4px;font-size:14px;color:#62625b">photos · 1,284枚</div>
</div>
<button type="button" aria-label="対象: カメラの写真" style="display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 8px;border:0;border-radius:12px;background:transparent;color:#62625b;font:inherit;font-size:14px;cursor:pointer;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">カメラの写真</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<nav aria-label="表示" style="display:flex;gap:24px;margin-top:8px;border-bottom:1px solid rgba(145,145,140,0.2)">
<a href="Main.dc.html" aria-current="page" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid #d63031;font-size:14px;font-weight:600;color:#211922">カレンダー</a>
<a href="Map.dc.html" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">地図</a>
</nav>
</header>

<section style="padding:20px 16px 0">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
<div style="display:flex;align-items:center;gap:8px">
<button type="button" aria-label="前の月" style="width:36px;height:36px;border:0;border-radius:12px;background:transparent;color:#62625b;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
<h2 style="margin:0;font-size:18px;font-weight:700">2026年10月</h2>
<button type="button" aria-label="次の月" style="width:36px;height:36px;border:0;border-radius:12px;background:transparent;color:#62625b;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
</div>
<div style="display:flex;gap:8px">
<button type="button" style="padding:8px 14px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px">今日</button>
<button type="button" style="padding:8px 14px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px">撮影日なし 12</button>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px;font-size:12px;color:#62625b;margin-bottom:6px">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7"><div style="padding:0 8px">{{w}}</div></sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="35">
<div style="height:84px;border-radius:12px;background:{{d.bg}};padding:8px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:{{d.fg}}"><span>{{d.n}}</span><sc-if value="{{d.note}}" hint-placeholder-val="{{ false }}"><span aria-label="メモあり" style="width:6px;height:6px;border-radius:3px;background:#211922"></span></sc-if></div>
<div style="font-size:16px;font-weight:600">{{d.count}}</div>
</div>
</sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const counts = {3:4,4:18,5:2,11:31,12:9,18:1,19:6,25:12,26:3};
    const notes = {4:true,11:true,20:true};
    const step = (c) => c >= 30 ? '#e8c9b8' : c >= 10 ? '#eedacd' : c >= 3 ? '#f3e7de' : c >= 1 ? '#f7f0ea' : 'transparent';
    const days = [];
    for (let i = 0; i < 4; i++) days.push({ n: '', count: '', bg: 'transparent', fg: '#62625b', note: false });
    for (let n = 1; n <= 31; n++) {
      const c = counts[n] || 0;
      const note = !!notes[n];
      days.push({ n: String(n), count: c ? String(c) : '', bg: c ? step(c) : (note ? '#f6f6f3' : 'transparent'), fg: '#62625b', note });
    }
    return { weekdays: ['日','月','火','水','木','金','土'], days };
  }
}
</script>
</body>
</html>
