<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォトダイアリー 375px</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:375px;height:812px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue','ヒラギノ角ゴ Pro W3',Meiryo,sans-serif;overflow:hidden">

<div style="height:48px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid rgba(145,145,140,0.2)">
<button type="button" aria-label="メニュー" style="width:44px;height:44px;border:0;background:transparent;color:#211922;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</div>

<header style="padding:8px 16px 0;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:center;gap:12px"><div style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#f6f6f3;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></div><div style="flex:1 1 auto;min-width:0"><h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">フォトダイアリー</h1><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-6px;margin-bottom:-6px"><span style="flex-shrink:0;font-size:14px;color:#62625b;white-space:nowrap">photos · 1,513枚</span><button type="button" aria-label="対象: すべての写真" style="display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;min-height:44px;padding:4px 8px;margin-right:-8px;box-sizing:border-box;border:0;border-radius:12px;background:transparent;color:#62625b;font:inherit;font-size:13px;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">すべての写真</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m6 9 6 6 6-6"/></svg></button></div></div></div>
<nav aria-label="表示" style="display:flex;gap:24px;margin-top:8px;border-bottom:1px solid rgba(145,145,140,0.2)">
<a href="Phone.dc.html" aria-current="page" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid #d63031;font-size:14px;font-weight:600;color:#211922">カレンダー</a>
<a href="Map.dc.html" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">地図</a>
</nav>
</header>

<section style="padding:16px 16px 0">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
<div style="display:flex;align-items:center;gap:4px">
<button type="button" aria-label="前の月" style="width:44px;height:44px;border:0;background:transparent;color:#62625b;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
<h2 style="margin:0;font-size:17px;font-weight:700">2026年10月</h2>
<button type="button" aria-label="次の月" style="width:44px;height:44px;border:0;background:transparent;color:#62625b;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
</div>
<button type="button" style="min-height:44px;padding:8px 14px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px">今日</button>
</div>
<div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:4px;font-size:11px;color:#62625b;margin-bottom:4px;text-align:center">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7"><div>{{w}}</div></sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:4px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="35">
<div style="height:52px;border-radius:10px;background:{{d.bg}};padding:4px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between">
<div style="font-size:11px;color:#62625b">{{d.n}}</div>
<div style="font-size:13px;font-weight:600">{{d.count}}</div>
</div>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const counts = {3:6,4:24,5:3,9:2,11:38,12:11,18:4,19:9,24:1,25:15,26:5};
    const notes = {20:true};
    const step = (c) => c >= 30 ? '#e8c9b8' : c >= 10 ? '#eedacd' : c >= 3 ? '#f3e7de' : c >= 1 ? '#f7f0ea' : 'transparent';
    const days = [];
    for (let i = 0; i < 4; i++) days.push({ n: '', count: '', bg: 'transparent' });
    for (let n = 1; n <= 31; n++) {
      const c = counts[n] || 0;
      days.push({ n: String(n), count: c ? String(c) : '', bg: c ? step(c) : (notes[n] ? '#f6f6f3' : 'transparent') });
    }
    return { weekdays: ['日','月','火','水','木','金','土'], days };
  }
}
</script>
</body>
</html>
