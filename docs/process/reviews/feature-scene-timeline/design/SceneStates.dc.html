<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シーン Visual index の状態</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1a0e10}
.hdr{all:unset;display:flex;align-items:center;gap:8px;font-size:14px;color:#c4a0a4}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#f5e6e8;padding:8px 14px;border-radius:16px;background:#2f191b}
.btn:hover{background:#3a2023}
.ghost{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#c4a0a4;padding:6px 10px;border-radius:16px}
.ghost:hover{background:#2f191b;color:#f5e6e8}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</helmet>
<div style="width: 384px; height: 820px; box-sizing: border-box; padding: 16px; background: #1a0e10; color: #f5e6e8; font-family: -apple-system, system-ui, 'Hiragino Sans', sans-serif; display: flex; flex-direction: column; gap: 40px">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div class="hdr">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"></rect><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"></path></svg>
        <span>シーン</span>
        <span style="font-variant-numeric: tabular-nums">276</span>
        <sc-if value="{{s.hasCount}}" hint-placeholder-val="{{true}}">
          <span style="display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #4caf80"></span>{{s.count}}</span>
        </sc-if>
        <sc-if value="{{s.running}}" hint-placeholder-val="{{false}}">
          <svg class="spin" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>
        </sc-if>
        <svg aria-hidden="true" style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
      </div>

      <div role="img" aria-label="フレームの時間軸" style="position: relative; height: 44px; border-radius: 8px; background: #231216; overflow: hidden">
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="40">
          <div style="position: absolute; top: 16px; bottom: 8px; width: 1px; left: {{t.left}}; background: rgba(196,160,164,0.45)"></div>
        </sc-for>
        <sc-for list="{{s.marks}}" as="m" hint-placeholder-count="6">
          <div style="position: absolute; top: 4px; width: 9px; height: 9px; margin-left: -4px; box-sizing: border-box; border-radius: 9999px; left: {{m.left}}; {{m.dot}}"></div>
          <div style="position: absolute; top: 15px; bottom: 6px; width: 2px; margin-left: -1px; left: {{m.left}}; {{m.line}}"></div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; left: 24.9%; background: #e85d5e"></div>
      </div>

      <sc-if value="{{s.isStale}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 12px; line-height: 1.5; color: #f4c674">フレームが作り直されたため、シーンの選び方が古くなっています</div>
      </sc-if>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px">
        <span style="font-size: 12px; color: #c4a0a4; font-variant-numeric: tabular-nums">{{s.note}}</span>
        <sc-if value="{{s.hasAction}}" hint-placeholder-val="{{true}}">
          <button class="{{s.actionClass}}">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M8 16H3v5"></path></svg>
            {{s.action}}
          </button>
        </sc-if>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>

var TIMES = [6.46, 9.44, 12.86, 15.52, 18.78, 21.4, 24.65, 28.95, 34.71, 35.8, 37.71, 38.82, 41.21, 42.57, 44.21, 45.54, 47.87, 51.91, 54.46, 55.63, 56.59, 60.05, 74.97, 77.41, 79.9, 87.88, 89.83, 91.3, 92.77, 96.24, 104.25, 106.21, 110.17, 112.85, 122.35, 125.79, 127.76, 132.23, 134.71, 142.18, 144.17, 144.49, 146.14, 150.58, 154.08, 166.97, 172.93, 174.9, 177.34, 182.82, 186.31, 200.27, 202.24, 204.69, 206.64, 208.63, 212.6, 220.55, 223.02, 225.99, 234.47, 236.44, 242.92, 244.38, 245.85, 248.32, 248.36, 250.29, 256.26, 256.6, 258.25, 264.22, 266.03, 266.08, 273.7, 282.67, 287.12, 289.61, 292.06, 296.05, 299.01, 301.98, 304.96, 307.17, 314.14, 317.08, 319.05, 322.02, 325.49, 327.49, 330.43, 331.9, 337.4, 344.34, 345.84, 347.21, 348.59, 352.05, 356.03, 361.92, 363.26, 366.25, 368.7, 371.18, 372.68, 377.17, 378.9, 380.51, 384.22, 386.19, 391.68, 394.72, 397.66, 401.16, 403.1, 406.6, 412.05, 416.02, 417.99, 429.96, 431.89, 434.4, 435.88, 440.87, 443.83, 445.54, 446.0, 447.79, 452.24, 454.69, 456.45, 458.89, 460.89, 462.33, 469.36, 476.31, 483.65, 488.03, 489.51, 494.46, 497.95, 505.77, 507.21, 510.2, 512.15, 520.15, 527.65, 529.1, 531.09, 540.45, 542.91, 546.4, 548.61, 556.09, 558.56, 561.03, 563.5, 568.99, 571.96, 575.41, 579.4, 581.37, 586.32, 588.79, 592.26, 593.73, 596.2, 605.7, 609.14, 611.55, 614.52, 618.48, 619.95, 624.45, 627.42, 636.37, 643.84, 647.34, 649.79, 652.76, 657.22, 658.69, 663.19, 664.66, 671.1, 679.85, 682.82, 691.79, 694.79, 696.49, 701.46, 703.93, 705.87, 710.68, 722.21, 722.66, 724.12, 729.62, 732.1, 736.07, 739.54, 742.03, 747.0, 751.95, 755.43, 759.72, 761.66, 771.16, 773.63, 781.13, 787.29, 795.27, 798.76, 801.1, 807.35, 810.32, 816.79, 818.76, 824.25, 825.7, 831.37, 835.33, 839.31, 844.8, 848.77, 853.95, 856.43, 862.9, 865.89, 868.83, 876.81, 881.31, 884.78, 886.71, 889.18, 892.12, 897.12, 904.07, 908.07, 915.01, 917.99, 919.95, 921.95, 925.92, 933.87, 937.36, 939.1, 942.04, 947.01, 949.51, 952.98, 955.92, 958.42, 962.37, 968.36, 974.31, 98 var DUR = 1124;

var DONE = { dot: 'background: #4caf80;', line: 'background: #4caf80;' };
var PENDING = { dot: 'border: 1.5px solid #4caf80;', line: 'background: rgba(76,175,128,0.35);' };

function pct(t) {

}

class Component extends DCLogic {
