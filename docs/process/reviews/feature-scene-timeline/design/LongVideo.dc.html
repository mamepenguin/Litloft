<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CLIP フレーム 長い動画</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1a0e10}
.f{background-image:url(/_blob/6a1275016e762411e838f81a83d9fea2);background-size:2400% 1200%;background-repeat:no-repeat}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
</style>
</helmet>
<div style="width: 384px; height: 480px; box-sizing: border-box; padding: 16px; background: #1a0e10; color: #f5e6e8; font-family: -apple-system, system-ui, 'Hiragino Sans', sans-serif; display: flex; flex-direction: column; gap: 14px">
  <button style="all: unset; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #c4a0a4">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"></rect><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"></path></svg>
    <span>CLIP フレーム</span>
    <span style="font-variant-numeric: tabular-nums">500</span>
    <svg aria-hidden="true" style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
  </button>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div role="img" aria-label="フレームの時間軸" style="position: relative; height: 36px; border-radius: 8px; background: #231216; overflow: hidden">
      <div style="position: absolute; top: 0; bottom: 0; left: {{bandLeft}}; width: {{bandWidth}}; background: rgba(245,230,232,0.10); box-shadow: inset 1px 0 0 rgba(245,230,232,0.5), inset -1px 0 0 rgba(245,230,232,0.5)"></div>
      <sc-for list="{{ticks}}" as="t" hint-placeholder-count="40">
        <div style="position: absolute; top: 8px; bottom: 8px; width: 1px; left: {{t.left}}; background: rgba(196,160,164,0.35)"></div>
      </sc-for>
      <div style="position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; left: {{playLeft}}; background: #e85d5e"></div>
    </div>
    <div style="position: relative; height: 14px; font-size: 11px; color: #c4a0a4; font-variant-numeric: tabular-nums">
      <span style="position: absolute; left: 0">0:00</span>
      <span style="position: absolute; left: 24.0%; transform: translateX(-50%)">1:00:00</span>
      <span style="position: absolute; left: 48.1%; transform: translateX(-50%)">2:00:00</span>
      <span style="position: absolute; left: 72.1%; transform: translateX(-50%)">3:00:00</span>
      <span style="position: absolute; right: 0">4:09:30</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px">
    <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="9">
      <button class="tile" aria-label="{{tile.label}} から再生">
        <div class="f" style="aspect-ratio: 4 / 3; border-radius: 8px; background-position: {{tile.pos}}; {{tile.ring}}"></div>
        <span style="font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; color: {{tile.labelColor}}">{{tile.label}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":384,"height":480}}'>
var DUR = 14970 + 30;
var N = 500;
var STEP = 30;

function fmt(s) {
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var r = Math.floor(s % 60);
  var mm = (h > 0 && m < 10 ? '0' : '') + m;
  return (h > 0 ? h + ':' : '') + mm + ':' + (r < 10 ? '0' : '') + r;
}

function pct(t) {
  return (t / DUR * 100).toFixed(3) + '%';
}

class Component extends DCLogic {
  renderVals() {
    var playhead = 4362;
    var playIdx = Math.floor(playhead / STEP);
    var start = playIdx - 4;
    var ticks = [];
    for (var k = 0; k < N; k++) ticks.push({ left: pct(k * STEP) });
    var tiles = [];
    for (var i = start; i < start + 9; i++) {
      var s = (i * 7) % 276;
      var col = s % 24;
      var row = Math.floor(s / 24);
      var playing = i === playIdx;
      tiles.push({
        pos: (col / 23 * 100).toFixed(3) + '% ' + (row / 11 * 100).toFixed(3) + '%',
        label: fmt(i * STEP),
        ring: playing ? 'outline: 2px solid #e85d5e; outline-offset: 2px;' : '',
        labelColor: playing ? '#f5e6e8' : '#c4a0a4'
      });
    }
    return {
      ticks: ticks,
      tiles: tiles,
      playLeft: pct(playhead),
      bandLeft: pct(start * STEP),
      bandWidth: pct(9 * STEP)
    };
  }
}
</script>
</body>
</html>
