<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>文字起こし 提案 タップ後</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#d63031}a:hover{color:#b52425}
</style>
</helmet>
<div style="width: 390px; height: 600px; box-sizing: border-box; padding: 12px 16px; background: #f6f6f3; font-family: -apple-system, system-ui, 'Hiragino Sans', sans-serif; color: #211922; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
<div style="display: flex; gap: 4px">
<button type="button" style="border: 0; border-radius: 8px; padding: 2px 6px; font-size: 12px; background: #d63031; color: #ffffff">文字起こし</button>
<button type="button" style="border: 0; border-radius: 8px; padding: 2px 6px; font-size: 12px; background: #ffffff; color: #211922">単語</button>
</div>
<button type="button" style="margin-left: auto; border: 0; border-radius: 8px; padding: 2px 8px; font-size: 12px; background: transparent; color: #62625b">AIで整える</button>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; border-radius: 8px; background: #ffffff; padding: 8px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
<div style="border-radius: 8px; background: {{row.bg}}">
<button type="button" style="display: flex; gap: 12px; width: 100%; text-align: left; border: 0; border-radius: 8px; min-height: 44px; padding: 6px 8px; font-family: inherit; font-size: 14px; line-height: 20px; background: transparent; color: {{row.fg}}">
<span style="flex-shrink: 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #62625b">{{row.time}}</span>
<span style="min-width: 0; flex: 1">{{row.text}}</span>
</button>
<sc-if value="{{row.selected}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: flex-end; gap: 12px; padding: 0 4px 6px">
<button type="button" style="display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 12px; font-weight: 500; color: #62625b"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg>修正</button>
<button type="button" style="display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 12px; font-weight: 500; color: #62625b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path></svg>引用</button>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":600}}'>
class Component extends DCLogic {
renderVals() {
var data = [
['0:12', '今日は会議の議題を三つ確認してから、順番に進めていきます。'],
['0:21', 'まず先週の作業の振り返りですが、予定していた部分はほぼ終わりました。'],
['0:33', '残っているのは画面のレイアウトの調整と、細かい文言の修正です。'],
['0:45', '次に今週の予定です。新しい機能の設計を始めたいと考えています。'],
['0:58', '設計については来週の水曜日までに案をまとめて共有します。'],
['1:10', '最後に、その他の連絡事項があればお願いします。'],
['1:19', '特にないようでしたら、今日はここまでにします。']
];
return { rows: data.map(function (d, i) { return { time: d[0], text: d[1], selected: i === 2, bg: i === 2 ? 'rgba(214,48,49,0.1)' : 'transparent', fg: i === 2 ? '#d63031' : '#211922' }; }) };
}
}
</script>
</body>
</html>
