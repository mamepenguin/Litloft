<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コレクション再生 広い画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#62625b}a:hover{color:#211922}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #211922; font-family: -apple-system, system-ui, 'Segoe UI', 'Hiragino Sans', 'ヒラギノ角ゴ Pro W3', Meiryo, sans-serif; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid rgba(145,145,140,0.2)">
    <button type="button" aria-label="メニュー" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button type="button" aria-label="キューを隠す" aria-pressed="true" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #f6f6f3; color: #211922; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    <div style="flex: 1; display: flex; justify-content: center">
      <div style="width: 520px; height: 36px; border-radius: 18px; background: #f6f6f3; color: #62625b; font-size: 13px; display: flex; align-items: center; padding: 0 16px">Videos を検索</div>
    </div>
    <div style="width: 88px"></div>
  </header>

  <div style="flex: 1; min-height: 0; display: flex">
    <aside aria-label="キュー" style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid rgba(145,145,140,0.2); background: #ffffff">
      <div style="padding: 16px 12px 12px 16px; display: flex; align-items: flex-start; gap: 8px; border-bottom: 1px solid rgba(145,145,140,0.2)">
        <div style="flex: 1; min-width: 0">
          <a href="#" style="display: block; font-size: 15px; font-weight: 600; color: #211922; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">週末に見るライブ映像</a>
          <div style="margin-top: 2px; font-size: 12px; color: #62625b">3 / 12</div>
        </div>
        <button type="button" aria-label="ループ再生をオフにする" aria-pressed="true" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: rgba(214,48,49,0.12); color: #d63031; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
      </div>
      <ul style="list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1">
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="10">
          <li style="{{ row.rowStyle }}">
            <button type="button" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; text-align: left; font: inherit; color: inherit">
              <span style="{{ row.numStyle }}">{{ row.num }}</span>
              <span style="width: 48px; height: 27px; border-radius: 4px; flex-shrink: 0; background: {{ row.thumb }}"></span>
              <span style="min-width: 0; flex: 1; display: flex; flex-direction: column">
                <span style="{{ row.titleStyle }}">{{ row.title }}</span>
                <span style="font-size: 11px; color: #62625b">{{ row.dur }}</span>
              </span>
            </button>
            <span style="display: flex; gap: 0; flex-shrink: 0; color: #62625b">
              <button type="button" aria-label="上へ" style="width: 26px; height: 28px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
              <button type="button" aria-label="下へ" style="width: 26px; height: 28px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
              <button type="button" aria-label="コレクションから外す" style="width: 26px; height: 28px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
            </span>
          </li>
        </sc-for>
      </ul>
    </aside>

    <section style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(145,145,140,0.2); font-size: 13px">
        <a href="#" style="text-decoration: none">Videos</a>
        <span style="color: #91918c">/</span>
        <a href="#" style="text-decoration: none">週末に見るライブ映像</a>
        <span style="color: #91918c">/</span>
        <span style="color: #211922; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2024-08 野外ステージ 2 日目</span>
        <span style="flex: 1"></span>
        <button type="button" aria-label="前のファイル" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <span style="font-size: 12px; color: #62625b">3 / 12</span>
        <button type="button" aria-label="次のファイル" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        <button type="button" aria-label="インスペクタを隠す" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: #f6f6f3; color: #211922; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg></button>
      </div>

      <div style="flex: 1; min-height: 0; display: flex">
        <div style="flex: 1; min-width: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: #0b0b0a; position: relative; overflow: hidden">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(transparent, rgba(0,0,0,0.6)); display: flex; align-items: flex-end; padding: 0 16px 12px; gap: 12px">
              <div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(112,112,112,0.85); position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 38%; border-radius: 2px; background: #ffffff"></div></div>
              <span style="font-size: 11px; color: #ffffff">18:04 / 47:30</span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px">
            <button type="button" aria-pressed="true" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #211922; color: #ffffff; font-size: 12px; font-weight: 500">チャプター</button>
            <button type="button" aria-pressed="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #e5e5e0; color: #211922; font-size: 12px; font-weight: 500">ノート</button>
          </div>
          <div style="flex: 1; min-height: 0; border: 1px solid rgba(145,145,140,0.2); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
            <div style="display: flex; gap: 12px"><span style="color: #62625b; width: 48px">00:00</span><span>オープニング</span></div>
            <div style="display: flex; gap: 12px"><span style="color: #62625b; width: 48px">06:12</span><span>1 曲目</span></div>
            <div style="display: flex; gap: 12px; font-weight: 600"><span style="color: #d63031; width: 48px">17:40</span><span>MC</span></div>
            <div style="display: flex; gap: 12px"><span style="color: #62625b; width: 48px">21:05</span><span>2 曲目</span></div>
          </div>
        </div>

        <aside aria-label="インスペクタ" style="width: 384px; flex-shrink: 0; border-left: 1px solid rgba(145,145,140,0.2); display: flex; flex-direction: column">
          <div role="tablist" style="display: flex; padding: 0 8px; border-bottom: 1px solid rgba(145,145,140,0.2)">
            <button type="button" role="tab" aria-selected="true" style="padding: 8px 12px; border: 0; border-bottom: 2px solid #211922; background: transparent; font-size: 12px; font-weight: 500; color: #211922">情報</button>
            <button type="button" role="tab" aria-selected="false" style="padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; font-size: 12px; font-weight: 500; color: #62625b">文字起こし</button>
            <button type="button" role="tab" aria-selected="false" style="padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; font-size: 12px; font-weight: 500; color: #62625b">関連</button>
            <button type="button" role="tab" aria-selected="false" style="padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; font-size: 12px; font-weight: 500; color: #62625b">質問</button>
          </div>
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
            <div>
              <div style="font-size: 18px; font-weight: 700; line-height: 1.35">2024-08 野外ステージ 2 日目</div>
              <div style="margin-top: 4px; font-size: 12px; color: #62625b">47:30 · 1080p · 2.1 GB</div>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #e5e5e0; font-size: 12px">いいね</button>
              <button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #e5e5e0; font-size: 12px">お気に入り</button>
              <button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #e5e5e0; font-size: 12px">コレクションに追加</button>
              <button type="button" aria-label="その他" style="height: 32px; width: 32px; border-radius: 16px; border: 0; background: #e5e5e0; font-size: 12px">…</button>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <span style="padding: 3px 10px; border-radius: 12px; background: #f6f6f3; font-size: 12px">live</span>
              <span style="padding: 3px 10px; border-radius: 12px; background: #f6f6f3; font-size: 12px">2024</span>
              <span style="padding: 3px 10px; border-radius: 12px; background: #f6f6f3; font-size: 12px">野外</span>
            </div>
            <div style="font-size: 13px; line-height: 1.7; color: #211922">2 日目の夕方の部。雨上がりでステージ前が混んでいた回。</div>
            <div style="border-top: 1px solid rgba(145,145,140,0.2); padding-top: 12px; font-size: 12px; color: #62625b">コメント 2 件</div>
          </div>
        </aside>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['1日目 開場前の様子', '12:40', '#c9c2b8'],
      ['1日目 メインステージ', '58:02', '#8a9a8c'],
      ['2024-08 野外ステージ 2 日目', '47:30', '#3d4a5c'],
      ['アンコール（客席から）', '09:15', '#6b5b73'],
      ['撤収とスタッフ挨拶', '04:51', '#a89276'],
      ['2023 冬の屋内公演', '1:12:08', '#55606e'],
      ['リハーサル抜粋', '22:17', '#7d8a6e'],
      ['ファンミーティング', '35:44', '#9c7f6a'],
      ['ドキュメンタリー 前編', '41:00', '#4f5a52'],
      ['ドキュメンタリー 後編', '43:26', '#6e6258']
    ];
    const rows = items.map((it, i) => {
      const current = i === 2;
      return {
        num: String(i + 1),
        title: it[0],
        dur: it[1],
        thumb: it[2],
        rowStyle: 'display: flex; align-items: center; gap: 4px; padding: 6px 4px 6px 6px; border-radius: 10px;' + (current ? ' background: rgba(214,48,49,0.08); box-shadow: inset 0 0 0 1px rgba(214,48,49,0.4);' : ''),
        numStyle: 'width: 18px; flex-shrink: 0; text-align: center; font-size: 10px; font-family: ui-monospace, Menlo, monospace; ' + (current ? 'color: #d63031; font-weight: 700' : 'color: #62625b'),
        titleStyle: 'font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (current ? 'color: #211922; font-weight: 600' : 'color: #211922')
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
