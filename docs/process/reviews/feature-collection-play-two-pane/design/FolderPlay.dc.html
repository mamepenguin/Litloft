<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォルダ再生</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#62625b}a:hover{color:#211922}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #211922; font-family: -apple-system, system-ui, 'Segoe UI', 'Hiragino Sans', 'ヒラギノ角ゴ Pro W3', Meiryo, sans-serif; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid rgba(145,145,140,0.2)">
    <button type="button" aria-label="メニュー" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button type="button" aria-label="キューを隠す" aria-pressed="true" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #f6f6f3; color: #211922; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    <div style="flex: 1; display: flex; justify-content: center">
      <div style="width: 520px; height: 36px; border-radius: 18px; background: #f6f6f3; color: #62625b; font-size: 13px; display: flex; align-items: center; padding: 0 16px">Music を検索</div>
    </div>
    <div style="width: 88px"></div>
  </header>

  <div style="flex: 1; min-height: 0; display: flex">
    <aside aria-label="キュー" style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid rgba(145,145,140,0.2)">
      <div style="padding: 16px 8px 12px 16px; display: flex; align-items: flex-start; gap: 4px; border-bottom: 1px solid rgba(145,145,140,0.2)">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Live 2024</div>
          <div style="margin-top: 2px; font-size: 12px; color: #62625b">5 / 24</div>
        </div>
        <button type="button" aria-label="ループ再生をオンにする" aria-pressed="false" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
        <button type="button" aria-label="キューを閉じてフォルダツリーに戻す" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <ul style="list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1">
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="12">
          <li style="{{ row.rowStyle }}">
            <button type="button" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; text-align: left; font: inherit; color: inherit">
              <span style="{{ row.numStyle }}">{{ row.num }}</span>
              <span style="{{ row.titleStyle }}">{{ row.title }}</span>
              <span style="font-size: 11px; color: #62625b; flex-shrink: 0">{{ row.dur }}</span>
            </button>
          </li>
        </sc-for>
      </ul>
    </aside>

    <section style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(145,145,140,0.2); font-size: 13px">
        <a href="#" style="text-decoration: none">Music</a>
        <span style="color: #91918c">/</span>
        <a href="#" style="text-decoration: none">Live 2024</a>
        <span style="color: #91918c">/</span>
        <span style="font-weight: 500">05 夜明けの歌.flac</span>
        <span style="flex: 1"></span>
        <button type="button" aria-label="前のファイル" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <span style="font-size: 12px; color: #62625b">5 / 24</span>
        <button type="button" aria-label="次のファイル" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent; color: #62625b; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        <button type="button" aria-label="インスペクタを隠す" style="width: 32px; height: 32px; border: 0; border-radius: 10px; background: #f6f6f3; color: #211922; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg></button>
      </div>
      <div style="flex: 1; min-height: 0; display: flex">
        <div style="flex: 1; min-width: 0; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 20px">
          <div style="width: 320px; height: 320px; border-radius: 16px; background: #55606e"></div>
          <div style="width: 520px; display: flex; flex-direction: column; gap: 8px">
            <div style="height: 4px; border-radius: 2px; background: #e5e5e0; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 22%; border-radius: 2px; background: #d63031"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: #62625b"><span>1:02</span><span>4:41</span></div>
          </div>
        </div>
        <aside aria-label="インスペクタ" style="width: 384px; flex-shrink: 0; border-left: 1px solid rgba(145,145,140,0.2); padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="font-size: 18px; font-weight: 700">05 夜明けの歌</div>
          <div style="font-size: 12px; color: #62625b">4:41 · FLAC · 31 MB</div>
        </aside>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [['01 開演','1:12'],['02 遠い街','4:05'],['03 雨の日','3:48'],['04 MC','2:30'],['05 夜明けの歌','4:41'],['06 帰り道','5:02'],['07 風の音','3:55'],['08 MC','1:40'],['09 光','4:20'],['10 約束','4:58'],['11 アンコール','6:12'],['12 終演','0:48']];
    const rows = items.map((it, i) => {
      const current = i === 4;
      return {
        num: String(i + 1), title: it[0], dur: it[1],
        rowStyle: 'display: flex; align-items: center; padding: 8px 8px 8px 6px; border-radius: 10px;' + (current ? ' background: rgba(214,48,49,0.08); box-shadow: inset 0 0 0 1px rgba(214,48,49,0.4);' : ''),
        numStyle: 'width: 18px; flex-shrink: 0; text-align: center; font-size: 10px; font-family: ui-monospace, Menlo, monospace; ' + (current ? 'color: #d63031; font-weight: 700' : 'color: #62625b'),
        titleStyle: 'flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #211922;' + (current ? ' font-weight: 600' : '')
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
