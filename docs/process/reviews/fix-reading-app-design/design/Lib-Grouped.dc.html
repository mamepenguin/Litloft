<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>読む ライブラリ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;width:100%;min-height:1040px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue','ヒラギノ角ゴ Pro W3',Meiryo,sans-serif;line-height:1.6">

<aside style="flex:1 1 240px;max-width:240px;min-width:0">
<dc-import name="Sidebar" active="reading" hint-size="240px,1040px"></dc-import>
</aside>

<main style="flex:999 1 560px;min-width:0;padding-bottom:40px">
<header style="padding:28px 32px 0">
<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<div style="width:48px;height:48px;border-radius:12px;background:#f6f6f3;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></div>
<div style="flex:1 1 240px;min-width:0">
<h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700">読む</h1>
<div style="font-size:13px;color:#62625b">家族ドライブ · 706 冊</div>
</div>
<button type="button" style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px;cursor:pointer"><span style="color:#62625b">対象</span><span>すべての本</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<nav aria-label="読むの面" style="display:flex;gap:24px;margin-top:16px;border-bottom:1px solid rgba(145,145,140,0.2)">
<a href="Main.dc.html" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">発見</a>
<a href="#lib" aria-current="page" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid #d63031;font-size:14px;font-weight:600;color:#211922">ライブラリ</a>
</nav>
</header>

<div style="padding:20px 32px 0;display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px"><span style="flex:0 0 auto;display:inline-flex;padding:6px 14px;border-radius:999px;background:#f6f6f3;color:#211922;font-size:13px">すべて</span><span style="flex:0 0 auto;display:inline-flex;padding:6px 14px;border-radius:999px;background:#f6f6f3;color:#211922;font-size:13px">漫画</span><span style="flex:0 0 auto;display:inline-flex;padding:6px 14px;border-radius:999px;background:#f6f6f3;color:#211922;font-size:13px">小説</span><span style="flex:0 0 auto;display:inline-flex;padding:6px 14px;border-radius:999px;background:#f6f6f3;color:#211922;font-size:13px">ビジネス書</span><span style="flex:0 0 auto;display:inline-flex;padding:6px 14px;border-radius:999px;background:#211922;color:#fff;font-size:13px;font-weight:600">技術書</span><span style="flex:0 0 auto;display:inline-flex;padding:6px 14px;border-radius:999px;background:#f6f6f3;color:#211922;font-size:13px">図鑑・事典</span><span style="flex:0 0 auto;display:inline-flex;padding:6px 14px;border-radius:999px;background:#f6f6f3;color:#211922;font-size:13px">雑誌</span></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button type="button" style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px;cursor:pointer"><span style="color:#62625b">タグ</span><span>指定なし</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button type="button" style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px;cursor:pointer"><span style="color:#62625b">状態</span><span>すべて</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div style="flex:1 1 0"></div><button type="button" style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px;cursor:pointer"><span style="color:#62625b">まとめ方</span><span>タグ別</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button type="button" style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:0;border-radius:16px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px;cursor:pointer"><span style="color:#62625b">並び順</span><span>新しい順</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div></div>
<div style="padding:24px 32px 0;display:flex;flex-direction:column;gap:36px">
<sc-for list="{{shelves}}" as="s" hint-placeholder-count="3">
<section>
<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
<h2 style="margin:0;font-size:18px;line-height:1.4;font-weight:700">{{s.name}} <span style="font-size:13px;font-weight:400;color:#62625b">{{s.count}}</span></h2>
<a href="#shelf" style="display:inline-flex;align-items:center;gap:2px;font-size:13px;color:#62625b">すべて見る<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
</div>
<div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:20px">
<sc-for list="{{s.items}}" as="b" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;gap:8px;min-width:0">
<div style="position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:{{b.bg}}">
<div style="position:absolute;left:0;right:0;top:0;padding:14px 12px;font-size:13px;line-height:1.4;font-weight:700;white-space:pre-line;color:rgba(33,25,34,0.78)">{{b.cover}}</div>
<div style="position:absolute;left:8px;bottom:10px;padding:0 6px;border-radius:6px;background:rgba(33,25,34,0.82);color:#ffffff;font-size:11px;line-height:18px;font-weight:500">{{b.fmt}}</div>
<sc-if value="{{b.hasProgress}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(33,25,34,0.25)"><div style="height:4px;width:{{b.progress}};background:#d63031"></div></div>
</sc-if>
</div>
<div style="font-size:14px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{b.title}}</div>
<div style="font-size:12px;color:#62625b">{{b.meta}}</div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const tints = [['#e6d8c9','#d8c7b3'],['#d9dcc6','#c7ccb0'],['#ead3cb','#dbbcb2'],['#e3dccb','#d3c9b0'],['#dccfc3','#c9b9aa'],['#e8dacf','#d9c3b3'],['#d4d9c8','#c2c9b2'],['#e5cfc4','#d6b9ab']];
    let n = 0;
    const mk = (rows) => rows.map((r) => {
      const t = tints[(n++) % tints.length];
      const p = r[5] || 0;
      return { title: r[0], cover: r[1], fmt: r[2], meta: r[3] + ' · ' + r[4], hasProgress: p > 0, progress: p + '%', bg: 'linear-gradient(160deg,' + t[0] + ',' + t[1] + ')' };
    });
    return { shelves: [
      { name: 'Swift', count: '24 冊', items: mk([["ちいかわ なんか小さくてかわいいやつ（５）", "ちいかわ（５）", "書庫", "漫画", "1週間前", 80], ["ひぐらしのなく頃に 巡（3）", "ひぐらしの\\nなく頃に 巡", "EPUB", "漫画", "昨日", 62], ["恐竜はじめました", "恐竜\\nはじめました", "EPUB", "漫画", "2年前", 0], ["クマとカラス", "クマとカラス", "書庫", "漫画", "8か月前", 0], ["おでかけ子ザメ5", "おでかけ子ザメ5", "書庫", "漫画", "3日前", 0], ["ちいかわ なんか小さくてかわいいやつ（４）", "ちいかわ（４）", "書庫", "漫画", "1年前", 100]]) },
      { name: 'データベース', count: '11 冊', items: mk([["達人に学ぶDB設計 徹底指南書", "達人に学ぶ\\nDB設計", "PDF", "技術書", "3日前", 38], ["ゼロからわかるDifyの教科書", "ゼロからわかる\\nDifyの教科書", "PDF", "技術書", "今日", 0], ["つくって、みなおす、デザインシステム", "つくって、\\nみなおす、\\nデザインシステム", "EPUB", "技術書", "今日", 0], ["モバイルアプリアクセシビリティ入門", "モバイルアプリ\\nアクセシビリティ\\n入門", "EPUB", "技術書", "昨日", 0], ["良いコード／悪いコードで学ぶ設計入門", "良いコード／\\n悪いコードで学ぶ\\n設計入門", "EPUB", "技術書", "3日前", 0], ["一冊でマスター！Swift Concurrency入門", "Swift\\nConcurrency\\n入門", "EPUB", "技術書", "4日前", 21]]) },
      { name: 'タグなし', count: '98 冊', items: mk([["頭のいい人が話す前に考えていること", "頭のいい人が話す前に考えていること", "EPUB", "ビジネス書", "1週間前", 12], ["思考法図鑑", "思考法図鑑", "PDF", "ビジネス書", "1年前", 0], ["仕事が速い人は、「これ」しかやらない", "仕事が速い人は、\\n「これ」しか\\nやらない", "EPUB", "ビジネス書", "3年前", 0], ["サクッとわかる ビジネス教養 AIの基本", "サクッとわかる\\nビジネス教養\\nAIの基本", "EPUB", "ビジネス書", "昨日", 0], ["世界一やさしい！細胞図鑑", "世界一やさしい！\\n細胞図鑑", "PDF", "図鑑", "2週間前", 47], ["散歩の雲・空図鑑", "散歩の\\n雲・空図鑑", "EPUB", "図鑑", "1年前", 0]]) }
    ] };
  }
}
</script>
</body>
</html>
