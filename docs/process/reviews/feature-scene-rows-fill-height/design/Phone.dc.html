<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホのシートのシーン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tab{all:unset;flex-shrink:0;height:40px;padding:0 12px;font-size:13px;color:#c4a0a4;border-bottom:2px solid transparent;box-sizing:border-box;display:inline-flex;align-items:center}
.tab.on{color:#f5e6e8;border-bottom-color:#e85d5e}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px; background: #120a0b; font-family: -apple-system, system-ui, 'Hiragino Sans', sans-serif; color: #f5e6e8">
  <sc-for list="{{phones}}" as="p" hint-placeholder-count="2">
    <div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000; border-radius: 24px">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{p.sheetH}}px; display: flex; flex-direction: column; background: #231216; border-radius: 16px 16px 0 0">
        <div style="flex-shrink: 0; height: 20px; display: flex; justify-content: center; align-items: center"><div style="width: 36px; height: 4px; border-radius: 9999px; background: #4a2c30"></div></div>
        <div role="tablist" aria-label="インスペクタ" style="flex-shrink: 0; display: flex; overflow: hidden; border-bottom: 1px solid #3a2023">
          <span class="tab">情報</span>
          <span class="tab">文字起こし</span>
          <span class="tab on">シーン</span>
          <span class="tab">詳細要約</span>
        </div>
        <div style="flex: 1 1 0%; min-height: 0; overflow-y: auto; padding: 16px; box-sizing: border-box">
          <dc-import name="Panel" pw="{{p.pw}}" ph="{{p.ph}}" noheader="{{p.yes}}" cardpos="below" hint-size="358px,600px"></dc-import>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function phone(sheetH) {
      var inner = sheetH - 20 - 41 - 32;
      return { sheetH: sheetH, pw: 358, ph: inner, yes: true };
    }
    return { phones: [phone(422), phone(700)] };
  }
}
</script>
</body>
</html>
